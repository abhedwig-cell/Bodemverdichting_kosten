<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img"><title>Figuur B Procesbasis en zes effectcategorieën</title><desc>Vereenvoudigd inhoudelijk overzicht. Het volledige netwerk v0.7 blijft de wetenschappelijke bespreekachtergrond. Pijlen zijn conditioneel.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#357e9f"/></marker></defs><rect width="100%" height="100%" fill="white"/>
