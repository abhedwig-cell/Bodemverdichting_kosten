<tspan x="50" dy="0">B  Gemeenschappelijke procesbasis en maatschappelijke gevolgen</tspan>
</text>
<text x="50" y="103" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#65747a" font-weight="normal" text-anchor="start">
<tspan x="50" dy="0">Bespreekconcept | vereenvoudiging van v0.7 | pijlen geven geen effectgrootte of vaste toe- of afname</tspan>
</text>
