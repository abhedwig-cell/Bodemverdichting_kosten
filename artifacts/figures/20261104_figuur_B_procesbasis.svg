<tspan x="1120" dy="0">Interne functies en externe doorwerking</tspan>
</text>
<text x="1070" y="916" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#65747a" font-weight="normal" text-anchor="start">
<tspan x="1070" dy="0">Doorwerking via de passende route; categorieën hangen samen.</tspan>
</text>
<text x="50" y="827" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#243b45" font-weight="normal" text-anchor="start">
<tspan x="50" dy="0">Gestippeld: biologische terugkoppeling op langere tijdschaal.</tspan>
<tspan x="50" dy="26.599999999999998">Wortels en biota beïnvloeden structuur en worden erdoor beïnvloed.</tspan>
<tspan x="50" dy="26.599999999999998">Waterkwaliteitsverandering kan ook ecologische gevolgen hebben.</tspan>
</text>
<rect x="410" y="965" width="1310" height="105" rx="8" fill="#eff2ed" stroke="#243b45" stroke-width="1.5"/>
<path d="M1410 930 L1410 965" fill="none" stroke="#357e9f" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="435" y="1003" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#243b45" font-weight="bold" text-anchor="start">
<tspan x="435" dy="0">Pas met receptor, blootstelling en passend schadebegrip volgt een maatschappelijke beoordeling.</tspan>
</text>
<text x="435" y="1041" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#243b45" font-weight="normal" text-anchor="start">
<tspan x="435" dy="0">Monetaire én niet-monetaire gevolgen | on-site apart houden | dubbeltelling toetsen</tspan>
</text>
<text x="50" y="1100" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#65747a" font-weight="normal" text-anchor="start">
<tspan x="50" dy="0">Bronbasis: BoVer en netwerk v0.7 (42 relaties behouden). Conceptfiguur is geen volledig causaal model of expertakkoord.</tspan>
</text>
