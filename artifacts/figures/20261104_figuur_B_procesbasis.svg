<text x="435" y="718" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#65747a" font-weight="normal" text-anchor="start">
<tspan x="435" dy="0">Waterverzadiging beïnvloedt gastransport en zuurstof.</tspan>
</text>
<text x="50" y="350" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#243b45" font-weight="normal" text-anchor="start">
<tspan x="50" dy="0">Context bepaalt de respons:</tspan>
<tspan x="50" dy="28.0">bodem en profiel, gewas,</tspan>
<tspan x="50" dy="28.0">weer, grondwater, drainage</tspan>
<tspan x="50" dy="28.0">en beheer.</tspan>
</text>
<text x="50" y="535" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#243b45" font-weight="normal" text-anchor="start">
<tspan x="50" dy="0">Transport van stoffen hangt</tspan>
<tspan x="50" dy="28.0">ook af van toepassing,</tspan>
<tspan x="50" dy="28.0">mobilisatie, sorptie, afbraak</tspan>
<tspan x="50" dy="28.0">en de gevolgde waterroute.</tspan>
</text>
