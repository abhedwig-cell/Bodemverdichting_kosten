<text x="795" y="740" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#65747a" font-weight="normal" text-anchor="start">
<tspan x="795" dy="0">Wortelbeeld en laagligging zijn schematisch.</tspan>
</text>
<text x="795" y="775" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#243b45" font-weight="normal" text-anchor="start">
<tspan x="795" dy="0">Wortels kunnen worden geremd of afbuigen;</tspan>
<tspan x="795" dy="25.2">doorgroei via bestaande poriën blijft mogelijk.</tspan>
</text>
<text x="25" y="320" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#243b45" font-weight="normal" text-anchor="start">
<tspan x="25" dy="0">Bouwvoor</tspan>
</text>
<text x="35" y="455" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#243b45" font-weight="normal" text-anchor="start">
<tspan x="35" dy="0">Onder-</tspan>
<tspan x="35" dy="23.799999999999997">grond</tspan>
</text>
<text x="85" y="845" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#243b45" font-weight="normal" text-anchor="start">
<tspan x="85" dy="0">Gestippelde pijl: mogelijke neerwaartse waterroute, geen fluxvergelijking.</tspan>
<tspan x="85" dy="28.0">Verdichting kan opslag, infiltratie, gastransport en beworteling veranderen; de respons is contextafhankelijk.</tspan>
</text>
<text x="85" y="922" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#65747a" font-weight="normal" text-anchor="start">
<tspan x="85" dy="0">Geen vaste laagdiepte of effectgrootte | bronbasis BoVer 3225 en 3404 | expertcontrole vereist</tspan>
</text>
