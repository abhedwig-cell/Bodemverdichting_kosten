<text x="135" y="740" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#65747a" font-weight="normal" text-anchor="start">
<tspan x="135" dy="0">Wortelbeeld en laagligging zijn schematisch.</tspan>
</text>
<text x="135" y="775" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#243b45" font-weight="normal" text-anchor="start">
<tspan x="135" dy="0">Referentie moet inhoudelijk worden gekozen;</tspan>
<tspan x="135" dy="25.2">zij is geen ongestoorde of ideale bodem.</tspan>
</text>
