name: Temporary finalize Tollebeek event forcing

on:
  push:
    branches:
      - work/tollebeek-event-forcing-v0.1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tollebeek-event-forcing-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependency
        run: python -m pip install requests
      - name: Apply bounded event forcing baseline
        run: python tools/_tmp_finalize_event_forcing.py
      - name: Commit bounded event forcing delta
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/events evidence data_requests model/traceability.csv schema tools/validate_domain_schema.py tools/validate_event_forcing_gate.py tools/validate_project.py tests/test_event_forcing_gate.py docs/27_tollebeek_event_forcing_baseline_v0_1.md workunits/tollebeek_event_forcing_v0_1_ACQUIRE_REVIEW.md .github/workflows/ci.yml
          git reset tools/_tmp_finalize_event_forcing.py
          git diff --cached --quiet && exit 0
          git commit -m "Admit bounded Tollebeek 1998 event forcing baseline"
          git push origin HEAD:work/tollebeek-event-forcing-v0.1
