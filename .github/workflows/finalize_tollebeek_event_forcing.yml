  cloud_cover_octants: {entity: meteorological_forcing_observation, label: Cloud cover, description: KNMI N native value., datatype: integer, unit: octant, nullable: true}
  relative_humidity_pct: {entity: meteorological_forcing_observation, label: Relative humidity, description: KNMI U native value., datatype: integer, unit: percent, nullable: true}
  present_weather_code: {entity: meteorological_forcing_observation, label: Present weather code, description: KNMI WW native code., datatype: integer, nullable: true}
  weather_station_type: {entity: meteorological_forcing_observation, label: Weather station type, description: KNMI IX native code., datatype: integer, nullable: true}
  fog_indicator: {entity: meteorological_forcing_observation, label: Fog indicator, description: KNMI M native indicator., datatype: integer, nullable: true}
  rain_indicator: {entity: meteorological_forcing_observation, label: Rain indicator, description: KNMI R native indicator., datatype: integer, nullable: true}
  snow_indicator: {entity: meteorological_forcing_observation, label: Snow indicator, description: KNMI S native indicator., datatype: integer, nullable: true}
  thunder_indicator: {entity: meteorological_forcing_observation, label: Thunder indicator, description: KNMI O native indicator., datatype: integer, nullable: true}
  ice_indicator: {entity: meteorological_forcing_observation, label: Ice indicator, description: KNMI Y native indicator., datatype: integer, nullable: true}
''',encoding='utf-8')

