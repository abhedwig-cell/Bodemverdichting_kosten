name: Probe Tollebeek antecedent forcing

on:
  push:
    branches:
      - work/tollebeek-antecedent-forcing-v0.1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose station-273 precipitation gaps and station-269 availability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          url='https://www.daggegevens.knmi.nl/klimatologie/uurgegevens'
          payload=urllib.parse.urlencode({
              'stns':'273:269', 'vars':'PRCP',
              'start':'1997102301', 'end':'1998102424'
          }).encode('ascii')
          req=urllib.request.Request(url,data=payload,headers={'User-Agent':'Bodemverdichting-kosten-antecedent-gap-diagnosis/0.1'},method='POST')
          with urllib.request.urlopen(req,timeout=180) as r:
              raw=r.read()
          text=raw.decode('utf-8-sig')
          station_header=[ln.strip() for ln in text.splitlines() if ln.startswith('#') and ('269' in ln or '273' in ln)]
          rows=[]
          for line_no,line in enumerate(text.splitlines(),start=1):
              s=line.strip()
              if not s or s.startswith('#'): continue
              vals=[x.strip() for x in line.split(',')]
              if len(vals)!=5:
                  raise SystemExit(f'unexpected PRCP row width {len(vals)} at {line_no}: {line}')
              stn,date,hh,dr,rh=vals
              d=datetime.strptime(date,'%Y%m%d').replace(tzinfo=timezone.utc)
              h=int(hh)
              end=d+(timedelta(days=1) if h==24 else timedelta(hours=h))
              start=end-timedelta(hours=1)
              rows.append({'stn':stn,'date':date,'hh':h,'DR':dr,'RH':rh,'start':start})

          t0=datetime(1997,10,24,tzinfo=timezone.utc); t1=datetime(1998,10,24,tzinfo=timezone.utc)
          by={s:{} for s in ('273','269')}
          for r in rows:
              if t0<=r['start']<t1 and r['stn'] in by:
                  by[r['stn']][r['start']]=r

          def blocks(times):
              times=sorted(times)
              if not times: return []
              out=[]; a=prev=times[0]
              for t in times[1:]:
                  if t-prev!=timedelta(hours=1):
                      out.append((a,prev+timedelta(hours=1)))
                      a=t
                  prev=t
              out.append((a,prev+timedelta(hours=1)))
              return [{'start':a.isoformat().replace('+00:00','Z'),'end_exclusive':b.isoformat().replace('+00:00','Z'),'hours':int((b-a).total_seconds()/3600)} for a,b in out]

          missing273_rh=[t for t,r in by['273'].items() if r['RH']=='']
          missing273_dr=[t for t,r in by['273'].items() if r['DR']=='']
          missing269_rh=[t for t,r in by['269'].items() if r['RH']=='']
          available269_for_273_gap=[t for t in missing273_rh if t in by['269'] and by['269'][t]['RH']!='']
          absent269_for_273_gap=[t for t in missing273_rh if t not in by['269'] or by['269'][t]['RH']=='']

          summary={
              'station_header_lines':station_header,
              'target_hours':8760,
              'station_273_rows':len(by['273']),
              'station_269_rows':len(by['269']),
              'station_273_missing_RH_count':len(missing273_rh),
              'station_273_missing_DR_count':len(missing273_dr),
              'station_273_missing_RH_blocks':blocks(missing273_rh),
              'station_269_missing_RH_count':len(missing269_rh),
              'station_269_missing_RH_blocks':blocks(missing269_rh),
              'station_269_available_for_273_missing_RH_count':len(available269_for_273_gap),
              'station_269_unavailable_for_273_missing_RH_count':len(absent269_for_273_gap),
              'guardrail':'Station 269 availability is diagnostic only. No cross-station substitution or gap filling is admitted by this probe.'
          }
          Path('antecedent_precip_gap_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY
      - name: Upload precipitation-gap diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: tollebeek-antecedent-precip-gap-diagnostic
          path: antecedent_precip_gap_summary.json
          if-no-files-found: error
