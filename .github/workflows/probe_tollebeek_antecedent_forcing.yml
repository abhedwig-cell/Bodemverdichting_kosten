name: Probe Tollebeek antecedent forcing

on:
  push:
    branches:
      - work/tollebeek-antecedent-forcing-v0.1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire and review KNMI station 273 antecedent forcing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, io, json, urllib.parse, urllib.request
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          URL = 'https://www.daggegevens.knmi.nl/klimatologie/uurgegevens'
          payload = urllib.parse.urlencode({
              'stns': '273',
              'vars': 'ALL',
              # Deliberately wider than the target period. HH 1..24 requests all hours.
              'start': '1997102301',
              'end': '1998102424',
          }).encode('ascii')
          req = urllib.request.Request(
              URL,
              data=payload,
              headers={'User-Agent': 'Bodemverdichting-kosten-antecedent-forcing/0.1'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=180) as r:
              raw = r.read()
          Path('knmi_273_antecedent_raw.txt').write_bytes(raw)
          raw_sha256 = hashlib.sha256(raw).hexdigest()
          text = raw.decode('utf-8-sig')

          native_fields = ['STN','YYYYMMDD','HH','DD','FH','FF','FX','T','T10N','TD','SQ','Q','DR','RH','P','VV','N','U','WW','IX','M','R','S','O','Y']
          data_rows = []
          for line_no, line in enumerate(text.splitlines(), start=1):
              s = line.strip()
              if not s or s.startswith('#'):
                  continue
              vals = [x.strip() for x in line.split(',')]
              if len(vals) != len(native_fields):
                  raise SystemExit(f'Unexpected KNMI row width at line {line_no}: {len(vals)} != {len(native_fields)}')
              row = dict(zip(native_fields, vals))
              if row['STN'] != '273':
                  raise SystemExit(f'Unexpected station at line {line_no}: {row["STN"]}')
              hh = int(row['HH'])
              d = datetime.strptime(row['YYYYMMDD'], '%Y%m%d').replace(tzinfo=timezone.utc)
              end = d + (timedelta(days=1) if hh == 24 else timedelta(hours=hh))
              start = end - timedelta(hours=1)
              row['_interval_start'] = start
              row['_interval_end'] = end
              row['_line'] = line_no
              data_rows.append(row)

          target_start = datetime(1997,10,24,0,0,tzinfo=timezone.utc)
          target_end = datetime(1998,10,24,0,0,tzinfo=timezone.utc)
          target = [r for r in data_rows if target_start <= r['_interval_start'] < target_end]
          boundary = [r for r in data_rows if target_end <= r['_interval_start'] < target_end + timedelta(days=1)]

          starts = [r['_interval_start'] for r in target]
          duplicates = [t.isoformat() for t,n in Counter(starts).items() if n > 1]
          gaps = []
          expected = target_start
          have = set(starts)
          while expected < target_end:
              if expected not in have:
                  gaps.append(expected.isoformat().replace('+00:00','Z'))
              expected += timedelta(hours=1)

          value_fields = native_fields[3:]
          missing = {f: sum(1 for r in target if r[f] == '') for f in value_fields}
          trace_counts = {
              'RH_minus1': sum(1 for r in target if r['RH'] == '-1'),
              'SQ_minus1': sum(1 for r in target if r['SQ'] == '-1'),
          }

          out_fields = [
              'antecedent_observation_id','source_station_id','source_date_yyyymmdd','source_hour_utc',
              'interval_start_utc','interval_end_utc',
              'wind_direction_deg','wind_hourly_mean_0_1_ms','wind_mean_0_1_ms','wind_gust_0_1_ms',
              'air_temperature_0_1_c','min_air_temperature_10cm_0_1_c','dewpoint_temperature_0_1_c',
              'sunshine_duration_0_1_h','global_radiation_j_cm2','precipitation_duration_0_1_h',
              'precipitation_amount_0_1_mm','sea_level_pressure_0_1_hpa','visibility_code','cloud_cover_octants',
              'relative_humidity_pct','present_weather_code','weather_station_type','fog_indicator','rain_indicator',
              'snow_indicator','thunder_indicator','ice_indicator'
          ]
          native_to_out = {
              'DD':'wind_direction_deg','FH':'wind_hourly_mean_0_1_ms','FF':'wind_mean_0_1_ms','FX':'wind_gust_0_1_ms',
              'T':'air_temperature_0_1_c','T10N':'min_air_temperature_10cm_0_1_c','TD':'dewpoint_temperature_0_1_c',
              'SQ':'sunshine_duration_0_1_h','Q':'global_radiation_j_cm2','DR':'precipitation_duration_0_1_h',
              'RH':'precipitation_amount_0_1_mm','P':'sea_level_pressure_0_1_hpa','VV':'visibility_code',
              'N':'cloud_cover_octants','U':'relative_humidity_pct','WW':'present_weather_code','IX':'weather_station_type',
              'M':'fog_indicator','R':'rain_indicator','S':'snow_indicator','O':'thunder_indicator','Y':'ice_indicator'
          }
          sio = io.StringIO(newline='')
          w = csv.DictWriter(sio, fieldnames=out_fields, lineterminator='\n')
          w.writeheader()
          for idx,r in enumerate(sorted(target, key=lambda x:x['_interval_start']), start=1):
              o = {
                  'antecedent_observation_id': f'ANT_TOL_1998_PRE1Y_{idx:04d}',
                  'source_station_id': r['STN'],
                  'source_date_yyyymmdd': r['YYYYMMDD'],
                  'source_hour_utc': r['HH'],
                  'interval_start_utc': r['_interval_start'].isoformat().replace('+00:00','Z'),
                  'interval_end_utc': r['_interval_end'].isoformat().replace('+00:00','Z'),
              }
              for nf,of in native_to_out.items():
                  o[of] = r[nf]
              w.writerow(o)
          normalized = sio.getvalue().encode('utf-8')
          Path('tollebeek_1997_1998_marknesse_antecedent_candidate.csv').write_bytes(normalized)
          normalized_sha256 = hashlib.sha256(normalized).hexdigest()

          # Compare the separately acquired first 24 event hours with the admitted canonical event rows.
          canonical = {}
          event_path = Path('data/events/tollebeek_1998_marknesse_hourly.csv')
          if event_path.exists():
              with event_path.open(encoding='utf-8', newline='') as f:
                  for r in csv.DictReader(f):
                      canonical[r['interval_start_utc']] = r
          compare_fields = list(native_to_out.values())
          mismatches = []
          for r in boundary:
              k = r['_interval_start'].isoformat().replace('+00:00','Z')
              c = canonical.get(k)
              if not c:
                  mismatches.append({'interval_start_utc': k, 'reason':'missing_in_canonical_event'})
                  continue
              for nf,of in native_to_out.items():
                  if r[nf] != c.get(of,''):
                      mismatches.append({'interval_start_utc':k,'field':of,'fresh':r[nf],'canonical':c.get(of,'')})

          summary = {
              'source_url': URL,
              'station_id': '273',
              'station_name': 'Marknesse',
              'request_start': '1997102301',
              'request_end': '1998102424',
              'raw_bytes': len(raw),
              'raw_sha256': raw_sha256,
              'parsed_rows_wide_request': len(data_rows),
              'target_start_utc': '1997-10-24T00:00:00Z',
              'target_end_utc_exclusive': '1998-10-24T00:00:00Z',
              'expected_target_hours': 8760,
              'target_rows': len(target),
              'duplicate_interval_count': len(duplicates),
              'duplicates': duplicates[:20],
              'gap_count': len(gaps),
              'gaps': gaps[:100],
              'missing_counts_by_native_variable': missing,
              'trace_counts': trace_counts,
              'normalized_bytes': len(normalized),
              'normalized_sha256': normalized_sha256,
              'boundary_comparison_rows': len(boundary),
              'boundary_mismatch_count': len(mismatches),
              'boundary_mismatches': mismatches[:100],
              'scientific_boundary': 'Acquisition/review candidate only; one year is not automatically a sufficient warm-up and no initial state is admitted.'
          }
          Path('antecedent_forcing_summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload antecedent forcing acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: tollebeek-antecedent-forcing-probe
          path: |
            knmi_273_antecedent_raw.txt
            tollebeek_1997_1998_marknesse_antecedent_candidate.csv
            antecedent_forcing_summary.json
          if-no-files-found: error
