name: Finalize Tollebeek managed-boundary evidence route

on:
  push:
    branches:
      - work/tollebeek-managed-boundary-v0.1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install pyyaml
      - name: Persist managed-boundary route
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv
          from pathlib import Path

          ROOT=Path('.')

          def upsert(path: Path, key: str, row: dict[str,str]):
              with path.open('r',encoding='utf-8',newline='') as f:
                  r=csv.DictReader(f); fields=r.fieldnames or []; rows=list(r)
              if set(row)!=set(fields):
                  raise SystemExit(f'{path}: field mismatch missing={set(fields)-set(row)} extra={set(row)-set(fields)}')
              for i,old in enumerate(rows):
                  if old[key]==row[key]: rows[i]=row; break
              else: rows.append(row)
              with path.open('w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          def append_semicolon(value,*items):
              xs=[x.strip() for x in value.split(';') if x.strip()]
              for x in items:
                  if x not in xs: xs.append(x)
              return ';'.join(xs)

          upsert(ROOT/'evidence/sources.csv','source_id',{
              'source_id':'SRC_TOLLEBEEK_PEIL2006',
              'source_title':'Peilbesluit Tollebeek 2006',
              'source_type':'OFFICIAL_ADMINISTRATIVE','source_year':'2006',
              'source_url':'https://www2.zuiderzeeland.nl/data/gmaps/peilbesluiten/NOP_Peilbesluit_Tollebeek_2006.pdf',
              'source_status':'ADMITTED',
              'source_notes':'Official near-period owner peilbesluit for the separate Tollebeek underbemalingen. It re-establishes the existing 1992 peilregime without peil changes and documents targets, pump capacities and water-system relations in 2006; it is not an event telemetry source for October 1998.'
          })
          upsert(ROOT/'evidence/sources.csv','source_id',{
              'source_id':'SRC_ZZL_WATERINFO',
              'source_title':'Waterschap Zuiderzeeland waterinformatie request route',
              'source_type':'OWNER_PUBLIC','source_year':'2026',
              'source_url':'https://www.zuiderzeeland.nl/regelen-en-aanvragen/melden-en-aanvragen/waterinformatie',
              'source_status':'QUALIFIED_WITH_LIMITATIONS',
              'source_notes':'Owner route for requesting water information including maps and measurement results when online sources are insufficient. Qualified as an acquisition route only; it does not itself provide the requested 1998 telemetry.'
          })

          evidence_rows=[
          {
              'evidence_id':'EV_TOL_BOUNDARY_HISTORICAL_SYSTEM','source_id':'SRC_TOLLEBEEK_PEIL2006',
              'evidence_statement':'The official 2006 Tollebeek peilbesluit retains the prior peil regime and documents separate underbemalingen OT02 De Rietgors, OT03 De Fuut and OT04 De Kievit, each with streefpeil NAP -6.20 m. The listed pump capacities are 2.600, 0.670 and 1.000 m3/s respectively, and all three pump directly to the Urkervaart. The same decision states that actual water levels fluctuate around target and may rise more than 0.20 m during heavy persistent rainfall.',
              'spatial_scope':'Historical Tollebeek underbemalingen OT02/OT03/OT04','time_scope':'2006 near-period description of pre-merger system',
              'evidence_value':'','evidence_unit':'','provenance_class':'OFFICIAL_METADATA',
              'intended_use':'Historical system topology, target-level and nominal-capacity context for reconstructing the 1998 managed boundary',
              'guardrail':'This is near-period official system evidence, not a 1998 event water-level, pump-runtime or realized-discharge series. The 2006 capacities must not be treated as exact 1998 realized discharge without event evidence.',
              'evidence_status':'QUALIFIED'
          },
          {
              'evidence_id':'EV_TOL_BOUNDARY_POST1998_REDESIGN','source_id':'SRC_ZZL_IJSVOGEL',
              'evidence_statement':'Waterschap Zuiderzeeland states that after the 1998 Tollebeek water-overload event multiple stuwen were added, a new connecting watercourse was built in 2010, larger culverts and embankments followed in 2011-2012, and new gemaal IJsvogel opened in 2012. The owner describes the old Fuut and Rietgors pumps as 40 and 156 m3/min and IJsvogel as 540 m3/min.',
              'spatial_scope':'Tollebeek water system','time_scope':'1998 event context and post-1998 redesign through 2012',
              'evidence_value':'','evidence_unit':'','provenance_class':'OFFICIAL_METADATA',
              'intended_use':'Exclude the current merged/IJsvogel control system from silent use as the October 1998 managed boundary',
              'guardrail':'Post-1998 works and current IJsvogel capacity are not 1998 boundary inputs. The retrospective does not supply exact 1998 water-level or realized-discharge time series.',
              'evidence_status':'QUALIFIED'
          },
          {
              'evidence_id':'EV_TOL_BOUNDARY_1998_CRISIS','source_id':'SRC_ZZL_WATERERFGOED_NOP',
              'evidence_statement':'Owner historical documentation describes the October 1998 crisis as occurring after days of rain and fully saturated soil, with about 75 mm overnight on 27-28 October; the Marknesser Sluis overflowed, a crisis centre was active and both large emergency pumps and about twenty smaller fire-brigade pumps were deployed while large flows moved toward low-lying Tollebeek.',
              'spatial_scope':'Noordoostpolder / Tollebeek 1998 response','time_scope':'27-28 October 1998 crisis context',
              'evidence_value':'','evidence_unit':'','provenance_class':'OFFICIAL_METADATA',
              'intended_use':'Event-control context showing that ordinary target-level/nameplate operation was insufficient and emergency intervention formed part of the actual 1998 boundary system',
              'guardrail':'The narrative does not provide exact pump locations, start/stop times, discharge hydrographs or water-level series and cannot be converted into a numerical boundary by assumption.',
              'evidence_status':'QUALIFIED'
          },
          {
              'evidence_id':'EV_TOL_BOUNDARY_OWNER_ARCHIVE_ROUTE','source_id':'SRC_ZZL_WATERINFO',
              'evidence_statement':'Waterschap Zuiderzeeland provides a formal water-information request route for maps and measurement results that are not available through its public online information. This is the owner route for requesting historical 1998 water levels, pump logs/runtime/discharge records, stuw/inlaat operation and related archival boundary evidence.',
              'spatial_scope':'Tollebeek / Urkervaart owner archive route','time_scope':'request route reviewed 2026-09-16 for 1998-10-24 through 1998-10-30 evidence',
              'evidence_value':'','evidence_unit':'','provenance_class':'OFFICIAL_METADATA',
              'intended_use':'Acquisition route for event-specific managed-boundary evidence',
              'guardrail':'A qualified request route is not the requested dataset. DR_SM_MANAGED_BOUNDARY remains partial until actual event evidence or a separately qualified reconstruction protocol is available.',
              'evidence_status':'QUALIFIED'
          }]
          for row in evidence_rows: upsert(ROOT/'evidence/evidence_register.csv','evidence_id',row)

          upsert(ROOT/'evidence/claims.csv','claim_id',{
              'claim_id':'CL_TOL_1998_MANAGED_BOUNDARY_GATE',
              'claim_statement':'The October 1998 managed boundary must be represented using the historical pre-IJsvogel Tollebeek control system, not the present merged OT.02/IJsvogel system. Official near-period evidence constrains historical target levels, topology and nominal capacities, and owner event accounts establish emergency intervention, but no event-specific surface-water-level, pump-discharge or control time series is currently admitted. The managed boundary therefore remains data-gated and must be identical or explicitly equivalent across matched CURRENT and REFERENCE runs once qualified.',
              'claim_type':'MANAGED_BOUNDARY_DATA_GATE',
              'evidence_ids':'EV_TOL_TARGET_LEVEL;EV_GROEN_BOUNDARY_SENSITIVITY;EV_TOL_BOUNDARY_HISTORICAL_SYSTEM;EV_TOL_BOUNDARY_POST1998_REDESIGN;EV_TOL_BOUNDARY_1998_CRISIS;EV_TOL_BOUNDARY_OWNER_ARCHIVE_ROUTE',
              'spatial_scope':'Historical Tollebeek OT02/OT03/OT04 control system / October 1998 event',
              'qualification_status':'QUALIFIED',
              'guardrail':'Do not use current IJsvogel/current merged OT.02 controls as a 1998 substitute; do not treat NAP -6.20 target as the actual event water-level series; do not convert nameplate capacity to realized discharge; do not choose a SWAP lower-boundary option in this evidence-route workunit.'
          })

          qual_rows=[
          {
              'qualification_id':'Q_TOL_BOUNDARY_HISTORICAL_SYSTEM','evidence_id':'EV_TOL_BOUNDARY_HISTORICAL_SYSTEM',
              'intended_use':'Historical topology, target and nominal-capacity constraints for managed-boundary reconstruction',
              'dependencies':'Official Peilbesluit Tollebeek 2006; historical-system distinction from current admitted OT.02 geometry',
              'test_or_review':'Reviewed separate Rietgors/Fuut/Kievit identities, NAP -6.20 targets, listed capacities, direct Urkervaart discharge and explicit target-versus-actual-level semantics.',
              'qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16',
              'qualification_notes':'Qualified as near-period official system evidence only. It does not establish exact 1998 event states or realized pump operation.'
          },
          {
              'qualification_id':'Q_TOL_BOUNDARY_POST1998_REDESIGN','evidence_id':'EV_TOL_BOUNDARY_POST1998_REDESIGN',
              'intended_use':'Prevent anachronistic use of current IJsvogel/merged-system controls for the 1998 event',
              'dependencies':'Owner 2023 Tollebeek retrospective and canonical event identity',
              'test_or_review':'Post-event chronology and old/new pump capacities reviewed against the official 2006/2010 system documentation.',
              'qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16',
              'qualification_notes':'Strong exclusion evidence for current-system backcasting; not a source of exact 1998 boundary hydrographs.'
          },
          {
              'qualification_id':'Q_TOL_BOUNDARY_1998_CRISIS','evidence_id':'EV_TOL_BOUNDARY_1998_CRISIS',
              'intended_use':'Establish that emergency intervention and system exceedance are material 1998 boundary context',
              'dependencies':'Owner water-heritage historical account; admitted 1998 event forcing',
              'test_or_review':'Chronology and emergency-response narrative reviewed for boundary relevance; no numerical schedule inferred.',
              'qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16',
              'qualification_notes':'Qualified as crisis/control context only. Missing timing, locations and realized discharge remain missing.'
          },
          {
              'qualification_id':'Q_TOL_BOUNDARY_OWNER_ARCHIVE_ROUTE','evidence_id':'EV_TOL_BOUNDARY_OWNER_ARCHIVE_ROUTE',
              'intended_use':'Acquire event-specific historical water-level and control evidence from the system owner',
              'dependencies':'Current owner water-information request route; explicit bounded data request',
              'test_or_review':'Verified that the owner accepts water-information questions including maps and measurement results when public data are insufficient.',
              'qualification_status':'QUALIFIED','review_date':'2026-09-16',
              'qualification_notes':'Qualified acquisition route only. No event-specific boundary dataset has yet been received or admitted.'
          }]
          for row in qual_rows: upsert(ROOT/'evidence/qualification_register.csv','qualification_id',row)

          req=ROOT/'data_requests/data_request_register.csv'
          with req.open('r',encoding='utf-8',newline='') as f:
              r=csv.DictReader(f); fields=r.fieldnames or []; rows=list(r)
          found=False
          for row in rows:
              if row['data_request_id']=='DR_SM_MANAGED_BOUNDARY':
                  found=True
                  row['input_readiness_status']='PARTIAL_EVIDENCE'
                  row['current_evidence_ids']='EV_TOL_TARGET_LEVEL;EV_GROEN_BOUNDARY_SENSITIVITY;EV_TOL_BOUNDARY_HISTORICAL_SYSTEM;EV_TOL_BOUNDARY_POST1998_REDESIGN;EV_TOL_BOUNDARY_1998_CRISIS;EV_TOL_BOUNDARY_OWNER_ARCHIVE_ROUTE'
                  row['current_claim_ids']=append_semicolon(row['current_claim_ids'],'CL_TOL_1998_MANAGED_BOUNDARY_GATE')
                  row['blocking_reason']='Historical pre-IJsvogel topology, target levels and near-period nominal pump capacities are now constrained, and the 1998 crisis/emergency-response context is qualified. However no event-specific 1998 surface-water-level series, Urkervaart level series, historical pump runtime/realized discharge, stuw/inlaat operation series or emergency-pump schedule is admitted. Current merged OT.02/IJsvogel controls are post-1998 and cannot substitute for the historical boundary.'
                  row['next_action']='Use the qualified owner water-information route to request 1998-10-24 through 1998-10-30 water levels for De Rietgors/De Fuut/De Kievit and Urkervaart, historical pump run-time/discharge records, stuw/inlaat operations and emergency-pump timing/location/capacity. If direct telemetry is unavailable, define a separately reviewable reconstruction protocol that preserves historical topology and uncertainty before any model mapping.'
                  row['request_notes']='Detailed request contract: data_requests/tollebeek_managed_boundary_data_request_v0_1.md. NAP -6.20 is a streefpeil, not an actual event hydrograph or groundwater head. Near-period nameplate capacities are not realized 1998 discharge. Current IJsvogel and the current merged OT.02 control topology are excluded as silent 1998 substitutes. Missing dynamic controls remain missing.'
          if not found: raise SystemExit('DR_SM_MANAGED_BOUNDARY not found')
          with req.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          tp=ROOT/'model/traceability.csv'
          with tp.open('r',encoding='utf-8',newline='') as f:
              r=csv.DictReader(f); tfields=r.fieldnames or []; trows=list(r)
          found=False
          for row in trows:
              if row['capability_id']=='CAP_MANAGED_BOUNDARY':
                  found=True
                  row['evidence_or_claim_ids']=append_semicolon(row['evidence_or_claim_ids'],'EV_TOL_BOUNDARY_HISTORICAL_SYSTEM','EV_TOL_BOUNDARY_POST1998_REDESIGN','EV_TOL_BOUNDARY_1998_CRISIS','EV_TOL_BOUNDARY_OWNER_ARCHIVE_ROUTE','CL_TOL_1998_MANAGED_BOUNDARY_GATE')
                  if row['capability_status']!='PARTIAL_METHOD_READY': raise SystemExit('CAP_MANAGED_BOUNDARY status changed unexpectedly')
                  row['broken_link']='Historical system semantics are constrained, but event-specific 1998 water levels, realized pump/control actions and emergency-pump schedule are missing; current IJsvogel/merged OT.02 cannot substitute.'
                  row['review_trigger']='Receipt of 1998 Tollebeek/Urkervaart level telemetry, historical pump/control logs, emergency-response records, or a proposed historical boundary reconstruction/model mapping.'
          if not found: raise SystemExit('CAP_MANAGED_BOUNDARY not found')
          with tp.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=tfields,lineterminator='\n'); w.writeheader(); w.writerows(trows)

          (ROOT/'data_requests/tollebeek_managed_boundary_data_request_v0_1.md').write_text('''# Tollebeek 1998 managed-boundary data request v0.1\n\nPurpose: resolve `DR_SM_MANAGED_BOUNDARY` for event `EVT_TOL_1998_OCT` without backcasting the current IJsvogel/merged-OT.02 system.\n\nRequested historical window: `1998-10-24T00:00:00Z` through `1998-10-30T00:00:00Z`, with highest priority on the 27-28 October crisis period.\n\nRequested owner/archive evidence, preserving source-native timestamps/timezone, coordinates/location identity, vertical datum, units, QC and provenance:\n\n1. surface-water levels at or representative of De Rietgors (OT02), De Fuut (OT03), De Kievit (OT04) and their tochten;\n2. Urkervaart water level over the same period;\n3. pump on/off, runtime, setpoint, capacity-state or realized-discharge records for the historical Rietgors/Fuut/Kievit installations;\n4. stuw and inlaat operations that materially affected these peilgebieden;\n5. emergency-pump location, start/stop time, nominal/realized capacity and receiving water during the crisis;\n6. contemporary operator logs, calamity reports or event reconstructions sufficient to distinguish ordinary automatic control from emergency intervention.\n\nNear-period official peil and capacity documentation may constrain a later reconstruction but is not a substitute for event telemetry. `NAP -6.20 m` is a nominal streefpeil, not an observed hydrograph. Current IJsvogel/current merged OT.02 operation is post-1998 and is excluded unless an explicit historical equivalence is independently justified.\n''',encoding='utf-8')

          (ROOT/'docs/29_tollebeek_managed_boundary_evidence_route_v0_1.md').write_text('''# Tollebeek 1998 managed-boundary evidence route v0.1\n\nStatus: **HISTORICAL SYSTEM ROUTE QUALIFIED, EVENT BOUNDARY NOT ADMITTED**\n\n## Decision\n\nThe project can now distinguish the historical 1998 control system from the current Tollebeek system, but it does not yet possess an event-specific managed-boundary series. `DR_SM_MANAGED_BOUNDARY` therefore remains `PARTIAL_EVIDENCE`.\n\n## Historical system constraints\n\nThe official 2006 peilbesluit retained the earlier peil regime and described separate De Rietgors (OT02), De Fuut (OT03) and De Kievit (OT04) underbemalingen at NAP -6.20 m. It lists pump capacities of 2.600, 0.670 and 1.000 m3/s and direct discharge to the Urkervaart. The same source explicitly distinguishes streefpeil from actual water level and allows larger departures during persistent heavy rainfall.\n\nOwner retrospective evidence shows that the modern connecting watercourse and IJsvogel system are post-1998 adaptations. The 1998 event also involved emergency pumping and system exceedance. Consequently the current merged OT.02/IJsvogel system cannot be used silently as the 1998 event boundary.\n\n## Missing event controls\n\nNo admitted source currently provides a complete 1998 time series for local surface-water level, Urkervaart level, pump runtime/realized discharge, stuw/inlaat operation or emergency-pump deployment. Nominal target and nameplate capacity therefore remain constraints/context rather than numerical event boundary values.\n\n## Spatial consequence\n\nThe admitted current OT.02 polygon is valid as current peilgebied identity/profile sampling domain, but historical boundary control was split across at least Rietgors/Fuut/Kievit. A future source-model mapping must therefore resolve which admitted profile/model units belonged to which historical control unit or justify an explicit equivalence. This workunit does not synthesize historical subarea polygons.\n\n## Paired-run rule\n\nOnce a managed boundary is qualified, CURRENT and REFERENCE runs must use identical or explicitly equivalent boundary semantics so that compaction attribution is not confounded by control changes. This rule does not authorize an invented boundary.\n\n## Next route\n\nUse the owner water-information request route for event-period levels and control logs. If direct telemetry cannot be recovered, review a separate historical reconstruction protocol with explicit uncertainty and provenance before mapping anything into a source model.\n''',encoding='utf-8')

          (ROOT/'workunits/tollebeek_managed_boundary_v0_1_ACQUIRE_REVIEW.md').write_text('''# Tollebeek managed boundary v0.1 — ACQUIRE / REVIEW checkpoint\n\n- canonical start: `d43032e16b66e5255187baf7df554f5d2b4dc00d`\n- branch: `work/tollebeek-managed-boundary-v0.1`\n- event: `EVT_TOL_1998_OCT`\n- official near-period source: Peilbesluit Tollebeek 2006\n- owner retrospective sources: 1998/post-1998 Tollebeek water-system history\n- owner acquisition route: waterinformatie request for unavailable measurement results\n\nReviewed result:\n- historical Rietgors/Fuut/Kievit controls are distinct from current merged OT.02/IJsvogel;\n- target levels and near-period nominal capacities are constrained;\n- emergency response was material in 1998;\n- exact event dynamic boundary evidence remains missing.\n\nVerdict: `QUALIFY_MANAGED_BOUNDARY_HISTORICAL_ROUTE_NO_ADMIT_BOUNDARY`.\n\nNo event water-level hydrograph, realized pump discharge, stuw/inlaat schedule, emergency-pump series or source-model boundary option is admitted.\n''',encoding='utf-8')

          (ROOT/'tools/validate_managed_boundary_gate.py').write_text('''from __future__ import annotations\n\nimport csv\nfrom pathlib import Path\n\nROOT=Path(__file__).resolve().parents[1]\n\ndef rows(path):\n    with path.open('r',encoding='utf-8',newline='') as f: return list(csv.DictReader(f))\n\ndef validate():\n    errors=[]\n    req={r['data_request_id']:r for r in rows(ROOT/'data_requests/data_request_register.csv')}.get('DR_SM_MANAGED_BOUNDARY')\n    if not req: return ['missing DR_SM_MANAGED_BOUNDARY']\n    if req.get('input_readiness_status')!='PARTIAL_EVIDENCE': errors.append('DR_SM_MANAGED_BOUNDARY must remain PARTIAL_EVIDENCE; no event boundary is admitted')\n    required=('EV_TOL_BOUNDARY_HISTORICAL_SYSTEM','EV_TOL_BOUNDARY_POST1998_REDESIGN','EV_TOL_BOUNDARY_1998_CRISIS','EV_TOL_BOUNDARY_OWNER_ARCHIVE_ROUTE')\n    for eid in required:\n        if eid not in req.get('current_evidence_ids',''): errors.append(f'DR_SM_MANAGED_BOUNDARY missing {eid}')\n    if 'CL_TOL_1998_MANAGED_BOUNDARY_GATE' not in req.get('current_claim_ids',''): errors.append('managed-boundary gate claim missing')\n    boundary=(req.get('blocking_reason','')+' '+req.get('request_notes','')).lower()\n    for phrase in ('1998','ijsvogel','streefpeil','urkervaart','missing'):\n        if phrase not in boundary: errors.append(f'managed-boundary guardrail missing {phrase!r}')\n    evidence={r['evidence_id']:r for r in rows(ROOT/'evidence/evidence_register.csv')}\n    hist=evidence.get('EV_TOL_BOUNDARY_HISTORICAL_SYSTEM',{})\n    statement=hist.get('evidence_statement','')\n    for phrase in ('De Rietgors','De Fuut','De Kievit','2.600','0.670','1.000','Urkervaart'):\n        if phrase not in statement: errors.append(f'historical-system evidence missing {phrase!r}')\n    if hist.get('evidence_status')!='QUALIFIED': errors.append('historical-system evidence must be QUALIFIED')\n    post=evidence.get('EV_TOL_BOUNDARY_POST1998_REDESIGN',{})\n    if 'not 1998 boundary inputs' not in post.get('guardrail',''): errors.append('post-1998 redesign exclusion weakened')\n    route=evidence.get('EV_TOL_BOUNDARY_OWNER_ARCHIVE_ROUTE',{})\n    if route.get('evidence_status')!='QUALIFIED': errors.append('owner archive acquisition route not QUALIFIED')\n    claims={r['claim_id']:r for r in rows(ROOT/'evidence/claims.csv')}\n    claim=claims.get('CL_TOL_1998_MANAGED_BOUNDARY_GATE',{})\n    if claim.get('qualification_status')!='QUALIFIED': errors.append('managed-boundary gate claim not QUALIFIED')\n    if 'current IJsvogel' not in claim.get('guardrail',''): errors.append('claim must exclude current IJsvogel as 1998 substitute')\n    trace={r['capability_id']:r for r in rows(ROOT/'model/traceability.csv')}.get('CAP_MANAGED_BOUNDARY',{})\n    if trace.get('capability_status')!='PARTIAL_METHOD_READY': errors.append('CAP_MANAGED_BOUNDARY status changed unexpectedly')\n    if 'CL_TOL_1998_MANAGED_BOUNDARY_GATE' not in trace.get('evidence_or_claim_ids',''): errors.append('CAP_MANAGED_BOUNDARY traceability missing gate claim')\n    forbidden=(\n        ROOT/'data/hydrology/tollebeek_1998_managed_boundary.csv',\n        ROOT/'data/hydrology/tollebeek_managed_boundary.csv',\n        ROOT/'data/water_system/tollebeek_1998_managed_boundary.csv',\n    )\n    for p in forbidden:\n        if p.exists(): errors.append(f'unexpected admitted managed-boundary dataset: {p.relative_to(ROOT)}')\n    return errors\n\ndef main():\n    errors=validate()\n    if errors:\n        print('Tollebeek managed-boundary gate validation FAILED')\n        for e in errors: print(f'ERROR: {e}')\n        return 1\n    print('Tollebeek managed-boundary gate validation passed.')\n    print('Validated historical-system distinction, post-1998 exclusion, owner acquisition route and no-admit boundary semantics.')\n    return 0\n\nif __name__=='__main__': raise SystemExit(main())\n''',encoding='utf-8')

          (ROOT/'tests/test_managed_boundary_gate.py').write_text('''from __future__ import annotations\nimport sys,unittest\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]; TOOLS=ROOT/'tools'\nif str(TOOLS) not in sys.path: sys.path.insert(0,str(TOOLS))\nfrom validate_managed_boundary_gate import validate\nclass ManagedBoundaryGateTests(unittest.TestCase):\n    def test_managed_boundary_gate_integrity(self): self.assertEqual([],validate())\nif __name__=='__main__': unittest.main()\n''',encoding='utf-8')

          pv=ROOT/'tools/validate_project.py'
          text=pv.read_text(encoding='utf-8')
          if 'from validate_managed_boundary_gate import validate as validate_managed_boundary_gate' not in text:
              text=text.replace('from validate_initial_state_gate import validate as validate_initial_state_gate\n','from validate_initial_state_gate import validate as validate_initial_state_gate\nfrom validate_managed_boundary_gate import validate as validate_managed_boundary_gate\n')
          if '"docs/29_tollebeek_managed_boundary_evidence_route_v0_1.md"' not in text:
              text=text.replace('    "docs/28_tollebeek_initial_state_evidence_route_v0_1.md",\n','    "docs/28_tollebeek_initial_state_evidence_route_v0_1.md",\n    "docs/29_tollebeek_managed_boundary_evidence_route_v0_1.md",\n')
          if '"data_requests/tollebeek_managed_boundary_data_request_v0_1.md"' not in text:
              text=text.replace('    "data_requests/tollebeek_initial_state_data_request_v0_1.md",\n','    "data_requests/tollebeek_initial_state_data_request_v0_1.md",\n    "data_requests/tollebeek_managed_boundary_data_request_v0_1.md",\n')
          if 'errors.extend(f"managed-boundary-gate: {item}" for item in validate_managed_boundary_gate())' not in text:
              text=text.replace('    errors.extend(f"initial-state-gate: {item}" for item in validate_initial_state_gate())\n','    errors.extend(f"initial-state-gate: {item}" for item in validate_initial_state_gate())\n    errors.extend(f"managed-boundary-gate: {item}" for item in validate_managed_boundary_gate())\n')
          pv.write_text(text,encoding='utf-8')
          PY
      - name: Validate route postimage
        run: |
          python -m py_compile tools/validate_managed_boundary_gate.py tools/validate_project.py
          python tools/validate_project.py
          python -m unittest discover -s tests -v
      - name: Commit route postimage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence data_requests docs model tools tests workunits
          git commit -m "Qualify Tollebeek 1998 managed-boundary evidence route"
          git push origin HEAD:work/tollebeek-managed-boundary-v0.1
