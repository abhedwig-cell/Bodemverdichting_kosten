name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pyyaml
      - name: Compile workbook generator
        run: python -m py_compile tools/workbook_generator/generate.py tools/workbook_generator/contract.py tools/validate_evidence.py
      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -v
