name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pyyaml
      - name: Compile project validation and workbook tools
        run: >-
          python -m py_compile
          tools/workbook_generator/generate.py
          tools/workbook_generator/contract.py
          tools/validate_evidence.py
          tools/validate_current_state_gate.py
          tools/validate_drainage_gate.py
          tools/validate_event_forcing_gate.py
          tools/validate_formal_traceability.py
          tools/validate_domain_schema.py
          tools/validate_input_readiness.py
          tools/validate_initial_state_gate.py
          tools/validate_managed_boundary_gate.py
          tools/validate_land_use_gate.py
          tools/validate_model_config_gate.py
          tools/validate_spatial_geometry.py
          tools/validate_profile_baseline.py
          tools/validate_project.py
      - name: Run Status-A-light integrity gate
        run: python tools/validate_project.py
      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -v
