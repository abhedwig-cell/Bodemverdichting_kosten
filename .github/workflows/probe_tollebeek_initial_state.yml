name: Temporary probe Tollebeek initial state

on:
  push:
    branches:
      - work/tollebeek-initial-state-v0.1

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependency
        run: python -m pip install requests
      - name: Resolve nearest groundwater observations and well metadata
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, io, json
          from datetime import datetime, timezone
          from pathlib import Path
          import requests

          target=datetime(1998,10,24,tzinfo=timezone.utc)
          # BRO compact GLD CSV prototype is headerless here. Position 1=time, 2=water level [m],
          # 3=quality/status, followed by optional point metadata and process marker.
          candidates=[
            {'gld':'GLD000000055972','tube':'50bf8f73-2538-5d85-bcd3-22a10e12d9a3','gmw':'58bd55e6-a857-5fe2-a090-6ae787061739','obs':'onbekend','inside':True,'distance_m':0.0},
            {'gld':'GLD000000056073','tube':'415a12ad-b77a-59a6-a449-9fd3fa65d61f','gmw':'58bd55e6-a857-5fe2-a090-6ae787061739','obs':'onbekend','inside':True,'distance_m':0.0},
            {'gld':'GLD000000011107','tube':'646c2122-bff1-54e3-bbcd-1d6cf058d39e','gmw':'5214f1a6-2fe8-5100-a625-90212180afa8','obs':'regulier_beoordeeld','inside':False,'distance_m':157.5},
            {'gld':'GLD000000011178','tube':'7f10ae67-1d41-50cf-a8e2-72036eebc5a0','gmw':'5214f1a6-2fe8-5100-a625-90212180afa8','obs':'regulier_beoordeeld','inside':False,'distance_m':157.5},
            {'gld':'GLD000000011383','tube':'73583280-9398-577a-907d-dd7770f7d31f','gmw':'dd763fed-13e8-5b56-bc8d-5ad899be167d','obs':'regulier_beoordeeld','inside':False,'distance_m':316.5},
            {'gld':'GLD000000011464','tube':'d0974a33-6937-5548-a8f6-1c114822bd63','gmw':'dd763fed-13e8-5b56-bc8d-5ad899be167d','obs':'regulier_beoordeeld','inside':False,'distance_m':316.5},
          ]
          base='https://api.pdok.nl/tno/bro-grondwatermonitoring-in-samenhang-karakteristieken/ogc/v1'
          s=requests.Session(); out=[]
          def dt_parse(x):
              d=datetime.fromisoformat(x.replace('Z','+00:00'))
              if d.tzinfo is None: d=d.replace(tzinfo=timezone.utc)
              return d.astimezone(timezone.utc)
          for c in candidates:
              url=f'https://publiek.broservices.nl/gm/gld/v1/objectsAsCsv/{c["gld"]}'
              r=s.get(url,params={'rapportagetype':'compact','observatietype':c['obs']},timeout=90); r.raise_for_status()
              parsed=[]
              for row in csv.reader(io.StringIO(r.text)):
                  if len(row)<2 or not row[0].strip(): continue
                  try: dt=dt_parse(row[0].strip())
                  except Exception: continue
                  try: value=float(row[1]) if row[1].strip() else None
                  except Exception: value=None
                  parsed.append({'timestamp':row[0].strip(),'timestamp_utc':dt.isoformat(),'water_level_m':value,'status':row[2].strip() if len(row)>2 else None,'raw':row,'delta_days_signed':round((dt-target).total_seconds()/86400,3),'delta_days_abs':round(abs((dt-target).total_seconds())/86400,3)})
              parsed.sort(key=lambda x:x['delta_days_abs'])
              tube=s.get(f'{base}/collections/gm_gmw_monitoringtube/items/{c["tube"]}',params={'f':'json'},timeout=60); tube.raise_for_status()
              well=s.get(f'{base}/collections/gm_gmw/items/{c["gmw"]}',params={'f':'json'},timeout=60); well.raise_for_status()
              entry={**c,'series_row_count':len(parsed),'nearest':parsed[:10],'tube_properties':tube.json().get('properties'),'well_properties':well.json().get('properties')}
              # Nearest measurement before and after target separately.
              before=[x for x in parsed if x['delta_days_signed']<=0]
              after=[x for x in parsed if x['delta_days_signed']>=0]
              entry['nearest_before']=min(before,key=lambda x:x['delta_days_abs']) if before else None
              entry['nearest_after']=min(after,key=lambda x:x['delta_days_abs']) if after else None
              # Measurements within +/-45 days retained as bounded event context.
              entry['within_45_days']=[x for x in parsed if x['delta_days_abs']<=45]
              out.append(entry)
          Path('initial_state_event_anchors.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          compact=[]
          for e in out:
              compact.append({k:e.get(k) for k in ('gld','inside','distance_m','obs','series_row_count','nearest_before','nearest_after','within_45_days','tube_properties','well_properties')})
          print(json.dumps(compact,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tollebeek-initial-state-event-anchors
          path: initial_state_event_anchors.json
