name: Probe Tollebeek RhoC current-state provenance

on:
  push:
    branches:
      - work/tollebeek-current-state-rhoc-recovery-v0.1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire DANS RhoC README and CSV and inspect provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, io, json, urllib.request
          from collections import Counter
          from pathlib import Path

          base='https://phys-techsciences.datastations.nl/api/access/datafile/'
          files={'readme':98478,'csv':98475}
          ua={'User-Agent':'Bodemverdichting-kosten-rhoc-recovery/0.2'}
          raw={}
          for key,fid in files.items():
              req=urllib.request.Request(base+str(fid), headers=ua)
              with urllib.request.urlopen(req, timeout=120) as r:
                  raw[key]=r.read()

          readme=raw['readme'].decode('utf-8-sig',errors='replace')
          csv_text=raw['csv'].decode('utf-8-sig',errors='replace')
          reader=csv.DictReader(io.StringIO(csv_text), delimiter=';')
          rows=list(reader)
          fields=reader.fieldnames or []

          tokens=['Tollebeek','OT.02','Urk','Marknesse','Emmeloord','Dronten','Flevoland','Gelderland','RAAK','WER3382','5200043298','Flevo-land']
          token_hits={t:{'readme':False,'readme_lines':[],'row_count':0,'rows':[]} for t in tokens}
          for n,line in enumerate(readme.splitlines(),start=1):
              lo=line.lower()
              for t in tokens:
                  if t.lower() in lo:
                      token_hits[t]['readme']=True
                      token_hits[t]['readme_lines'].append({'line':n,'text':line})
          for i,row in enumerate(rows,start=2):
              joined=' | '.join('' if v is None else str(v) for v in row.values())
              lo=joined.lower()
              for t in tokens:
                  if t.lower() in lo:
                      token_hits[t]['row_count']+=1
                      if len(token_hits[t]['rows'])<10:
                          token_hits[t]['rows'].append({'line':i,'row':row})

          semantic={}
          dictionaries={
            'coordinate':['coord','latitude','longitude','lat','lon','easting','northing','rd_x','rd_y'],
            'location':['location','locatie','field','veld','site','pit','plot','parcel','perceel'],
            'date':['date','datum','year','jaar','time','day'],
            'depth':['depth','diep','cm','layer'],
            'method':['method','methode','sensor','ring','kopecky','rhoc'],
            'value':['density','bulk','bd','rho','water','moisture']
          }
          for f in fields:
              lf=f.lower()
              tags=[tag for tag,words in dictionaries.items() if any(w==lf or w in lf for w in words)]
              if tags: semantic[f]=tags

          uniques={}
          for f in fields:
              vals=[(r.get(f) or '').strip() for r in rows]
              ctr=Counter(vals)
              if len(ctr)<=60:
                  uniques[f]=dict(ctr.most_common())

          numeric_ranges={}
          for f,tags in semantic.items():
              if 'coordinate' not in tags: continue
              vals=[]
              for r in rows:
                  try: vals.append(float((r.get(f) or '').strip().replace(',','.')))
                  except: pass
              if vals: numeric_ranges[f]={'min':min(vals),'max':max(vals),'n':len(vals)}

          readme_lines=[]
          needles=['location','field','flevoland','gelderland','coordinate','date','depth','pit','kopecky','rhoc','column','variable','sample','project','funder','dronten']
          for n,line in enumerate(readme.splitlines(),start=1):
              if any(x in line.lower() for x in needles):
                  readme_lines.append({'line':n,'text':line})

          summary={
            'dataset_doi':'10.17026/PT/BYVPLB',
            'readme_file_id':files['readme'],
            'csv_file_id':files['csv'],
            'readme_bytes':len(raw['readme']),
            'csv_bytes':len(raw['csv']),
            'readme_sha256':hashlib.sha256(raw['readme']).hexdigest(),
            'csv_sha256':hashlib.sha256(raw['csv']).hexdigest(),
            'row_count':len(rows),
            'delimiter':';',
            'columns':fields,
            'semantic_fields':semantic,
            'numeric_ranges_coordinate_candidates':numeric_ranges,
            'low_cardinality_values':uniques,
            'token_hits':token_hits,
            'readme_relevant_lines':readme_lines,
            'first_rows':rows[:12]
          }
          Path('rhoc_probe_summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          print('RHO_CSV',json.dumps({'rows':len(rows),'columns':fields,'bytes':len(raw['csv']),'sha256':summary['csv_sha256']},ensure_ascii=False))
          print('SEMANTIC_FIELDS',json.dumps(semantic,indent=2,ensure_ascii=False))
          print('COORDINATE_RANGES',json.dumps(numeric_ranges,indent=2,ensure_ascii=False))
          print('TOKEN_HITS',json.dumps({k:{'readme':v['readme'],'readme_lines':v['readme_lines'],'row_count':v['row_count']} for k,v in token_hits.items()},indent=2,ensure_ascii=False))
          print('LOW_CARDINALITY',json.dumps(uniques,indent=2,ensure_ascii=False))
          print('README_RELEVANT',json.dumps(readme_lines,indent=2,ensure_ascii=False))
          print('FIRST_ROWS',json.dumps(rows[:12],indent=2,ensure_ascii=False))
          PY
      - name: Upload provenance probe summary
        uses: actions/upload-artifact@v4
        with:
          name: tollebeek-rhoc-current-state-probe
          path: rhoc_probe_summary.json
          if-no-files-found: error
