name: Temporary finalize Tollebeek current-state route

on:
  push:
    branches:
      - work/tollebeek-current-state-v0.1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tollebeek-current-state-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply current-state evidence and gate delta
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          def read_rows(path):
              with Path(path).open('r', encoding='utf-8', newline='') as f:
                  r = csv.DictReader(f)
                  return r.fieldnames, list(r)

          def write_rows(path, fields, rows):
              with Path(path).open('w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writeheader(); w.writerows(rows)

          p='evidence/sources.csv'; fields, rows=read_rows(p); ids={r['source_id'] for r in rows}
          additions=[
              {'source_id':'SRC_WUR_FLEVOCOMPACT2024','source_title':'Regionale kartering bodemverdichting in de provincie Flevoland','source_type':'TECHNICAL_REPORT','source_year':'2024','source_url':'https://doi.org/10.18174/672577','source_status':'QUALIFIED_WITH_LIMITATIONS','source_notes':'Wageningen Environmental Research Rapport 3382. Documents the 2020-2021 Flevoland field campaign using dry bulk density and penetration resistance and explicitly concludes that the available measurements/covariates did not yield a usable regional compaction map.'},
              {'source_id':'SRC_SIA_FLEVO_MOVEMENT','source_title':'Flevo - land in beweging','source_type':'PROJECT_METADATA','source_year':'2023','source_url':'https://www.sia-projecten.nl/project/flevo-land-in-beweging','source_status':'QUALIFIED_WITH_LIMITATIONS','source_notes':'Official NWO-SIA project record for RAAK.PRO02.021. States that more than 300 point measurements and a valuable province-wide compaction dataset were collected; does not itself expose a raw georeferenced measurement table.'},
          ]
          rows += [r for r in additions if r['source_id'] not in ids]; write_rows(p,fields,rows)

          p='evidence/evidence_register.csv'; fields, rows=read_rows(p); ids={r['evidence_id'] for r in rows}
          additions=[
              {'evidence_id':'EV_FLEVO_COMPACTION_FIELD_PROTOCOL','source_id':'SRC_WUR_FLEVOCOMPACT2024','evidence_statement':'The Flevoland field campaign used 305 agricultural sampling locations. Fieldwork ran from September 2020 through June 2021. Dry bulk density was measured with three undisturbed 100 cm3 rings at a fixed 30 cm depth and a field-selected variable depth, with laboratory determination according to ISO 11272:2017. Penetration resistance was measured with a calibrated Eijkelkamp penetrologger using ten measurements per location.','spatial_scope':'Agricultural Flevoland; exact OT.02 subset not yet resolved','time_scope':'September 2020 to June 2021','evidence_value':'305','evidence_unit':'field locations','provenance_class':'OFFICIAL_METADATA','intended_use':'Qualified direct-measurement protocol and candidate point-data source for current-state acquisition','guardrail':'Protocol quality does not identify which measurements fall inside OT.02 and does not make 2020-2021 measurements automatically representative of 2026 conditions.','evidence_status':'QUALIFIED'},
              {'evidence_id':'EV_FLEVO_COMPACTION_MAP_LIMIT','source_id':'SRC_WUR_FLEVOCOMPACT2024','evidence_statement':'The study concludes that the measured data and available spatial covariates did not support a usable regional map of disturbing compacted layers in Flevoland.','spatial_scope':'Flevoland regional mapping','time_scope':'reported 2024','evidence_value':'','evidence_unit':'','provenance_class':'TECHNICAL_REPORT_RELATION','intended_use':'Prevent regional interpolation from being used as local OT.02 CURRENT-state evidence','guardrail':'Do not infer OT.02 state values, affected area or profile weights from the unsuccessful regional map or province-wide summary percentages.','evidence_status':'QUALIFIED'},
              {'evidence_id':'EV_FLEVO_COMPACTION_DATASET_ROUTE','source_id':'SRC_SIA_FLEVO_MOVEMENT','evidence_statement':'The official Flevo - land in beweging project record states that more than 300 conventional point measurements were collected and that a valuable province-wide dataset was assembled.','spatial_scope':'Flevoland project dataset','time_scope':'project completed 2023; reviewed 2026-09-16','evidence_value':'300+','evidence_unit':'point measurements','provenance_class':'OFFICIAL_METADATA','intended_use':'Acquisition route for source geocoordinates and measurement values needed to test for OT.02 observations','guardrail':'Dataset existence does not establish public availability, an OT.02 subset or current 2026 representativeness. Raw coordinate/value records remain required.','evidence_status':'WAIT_DATA'},
          ]
          rows += [r for r in additions if r['evidence_id'] not in ids]; write_rows(p,fields,rows)

          p='evidence/claims.csv'; fields, rows=read_rows(p); ids={r['claim_id'] for r in rows}
          if 'CL_TOL_CURRENT_STATE_GATE' not in ids:
              rows.append({'claim_id':'CL_TOL_CURRENT_STATE_GATE','claim_statement':'No Tollebeek CURRENT soil-state value is admitted until source-native georeferenced measurements or a separately qualified derivation can be assigned reproducibly to the admitted OT.02 domain with date, depth, method and QC provenance. The 2020-2021 Flevoland field campaign is a qualified acquisition route for dated measured states, not an OT.02-wide or automatic 2026 CURRENT state.','claim_type':'CURRENT_STATE_DATA_GATE','evidence_ids':'EV_FLEVO_COMPACTION_FIELD_PROTOCOL;EV_FLEVO_COMPACTION_MAP_LIMIT;EV_FLEVO_COMPACTION_DATASET_ROUTE;EV_SOILPHYS_ROUTE','spatial_scope':'Tollebeek OT.02','qualification_status':'QUALIFIED','guardrail':'Do not substitute SoilPhys modal density, province-wide percentages, an unreliable regional interpolation or visually inferred map points for source georeferenced current-state records.'})
          write_rows(p,fields,rows)

          p='evidence/qualification_register.csv'; fields, rows=read_rows(p); ids={r['qualification_id'] for r in rows}
          additions=[
              {'qualification_id':'Q_FLEVO_COMPACTION_PROTOCOL','evidence_id':'EV_FLEVO_COMPACTION_FIELD_PROTOCOL','intended_use':'Direct-measurement acquisition protocol for candidate Tollebeek current-state records','dependencies':'WER Rapport 3382 methods; source-native point records still required for local use','test_or_review':'Method review of location selection, GPS recording, ring sampling, ISO laboratory determination and penetrologger protocol','qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16','qualification_notes':'Qualified as a measurement/data-source route. No OT.02 point identity or 2026 temporal representativeness is established by the report alone.'},
              {'qualification_id':'Q_FLEVO_COMPACTION_MAP_LIMIT','evidence_id':'EV_FLEVO_COMPACTION_MAP_LIMIT','intended_use':'Guardrail against using regional interpolation as Tollebeek state','dependencies':'WER Rapport 3382 regional cartography results','test_or_review':'Reviewed author conclusion that current data/covariates did not yield a usable regional map','qualification_status':'QUALIFIED','review_date':'2026-09-16','qualification_notes':'This negative result is authoritative for scope: interpolation from the reported campaign is not a qualified OT.02 CURRENT-state substitute.'},
              {'qualification_id':'Q_FLEVO_COMPACTION_DATA_ROUTE','evidence_id':'EV_FLEVO_COMPACTION_DATASET_ROUTE','intended_use':'Acquire raw georeferenced point records for an OT.02 spatial join','dependencies':'Project holder access to source point dataset','test_or_review':'Public-source search and project metadata reconciliation','qualification_status':'BLOCKED_DATA','review_date':'2026-09-16','qualification_notes':'The project confirms a valuable measurement dataset exists, but no public raw coordinate/value download was identified. Request source records from project/research holders before local admission.'},
          ]
          rows += [r for r in additions if r['qualification_id'] not in ids]; write_rows(p,fields,rows)

          p='data_requests/data_request_register.csv'; fields, rows=read_rows(p)
          for r in rows:
              if r['data_request_id']=='DR_SM_CURRENT_STATE':
                  r.update({
                      'input_readiness_status':'PARTIAL_EVIDENCE',
                      'current_evidence_ids':'EV_SOILPHYS_ROUTE;EV_TOL_PROFILE_SCREENING;EV_TOL_PROFILE_BOFEK_CROSSWALK;EV_FLEVO_COMPACTION_FIELD_PROTOCOL;EV_FLEVO_COMPACTION_MAP_LIMIT;EV_FLEVO_COMPACTION_DATASET_ROUTE',
                      'current_claim_ids':'CL_SPATIAL_GATE;CL_TOL_PROFILE_BASIS;CL_THEORY_STATE_RESPONSE_CONTEXT;CL_TOL_CURRENT_STATE_GATE',
                      'acceptance_criteria':'Provide source-native location IDs and coordinates, measurement dates, depth/depth-interval semantics, direct-measurement versus derived provenance, replicate/QC information and a reproducible spatial join to admitted OT.02. Any use outside the 2020-2021 observation period requires explicit temporal qualification. Missing values remain missing.',
                      'blocking_reason':'A qualified 2020-2021 Flevoland field-measurement campaign and dataset route exist, but the public sources do not expose the raw coordinate/value table needed for an auditable OT.02 join. The regional interpolation was judged unusable by the source study, and 2020-2021 measurements are not automatically a 2026 CURRENT state.',
                      'next_action':'Acquire the raw georeferenced Flevo-land-in-beweging / WER 3382 point records from the project or research holders; intersect them with the admitted OT.02 polygon; preserve date, depth, replicates and QC; then review whether the resulting local observations are sufficient for a dated CURRENT-state representation.',
                      'request_notes':'The detailed request contract is data_requests/tollebeek_current_state_data_request_v0_1.md. Do not substitute SoilPhys modal density, province-wide percentages or regional interpolation. Raw coordinate-level evidence is the next gate.'
                  })
          write_rows(p,fields,rows)

          path=Path('tools/validate_project.py'); text=path.read_text(encoding='utf-8')
          if 'validate_current_state_gate' not in text:
              text=text.replace('from validate_domain_schema import validate as validate_domain_schema\n', 'from validate_current_state_gate import validate as validate_current_state_gate\nfrom validate_domain_schema import validate as validate_domain_schema\n')
              text=text.replace('    "docs/21_data_model_v0_3_contract.md",\n', '    "docs/21_data_model_v0_3_contract.md",\n    "docs/25_tollebeek_current_state_evidence_route_v0_1.md",\n')
              text=text.replace('    "data_requests/data_request_register.csv",\n', '    "data_requests/data_request_register.csv",\n    "data_requests/tollebeek_current_state_data_request_v0_1.md",\n')
              text=text.replace('    errors.extend(f"domain-schema: {item}" for item in validate_domain_schema())\n', '    errors.extend(f"current-state-gate: {item}" for item in validate_current_state_gate())\n    errors.extend(f"domain-schema: {item}" for item in validate_domain_schema())\n')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit bounded non-workflow route delta
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence data_requests tools/validate_project.py
          git diff --cached --quiet && exit 0
          git commit -m "Qualify Tollebeek current-state measurement route"
          git push origin HEAD:work/tollebeek-current-state-v0.1
