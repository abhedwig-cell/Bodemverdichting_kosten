name: Retry Tollebeek model-config finalization

on:
  push:
    branches:
      - work/tollebeek-model-config-v0.1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install pyyaml
      - name: Reuse finalizer with controlled provenance class
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/finalize_tollebeek_model_config.yml').read_text(encoding='utf-8')
          start=text.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end=text.index("\n          PY\n", start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          code=code.replace("'provenance_class':'SOFTWARE_AUTHORITY'","'provenance_class':'SOFTWARE_QA'")
          Path('/tmp/finalize_model_config.py').write_text(code,encoding='utf-8')
          PY
          python /tmp/finalize_model_config.py
      - name: Validate authority-route postimage
        run: |
          python -m py_compile tools/validate_model_config_gate.py tools/validate_project.py
          python tools/validate_project.py
          python -m unittest discover -s tests -v
      - name: Commit authority-route postimage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence data_requests docs model tools tests workunits
          git commit -m "Qualify Tollebeek SWAP5 model authority route"
          git push origin HEAD:work/tollebeek-model-config-v0.1
