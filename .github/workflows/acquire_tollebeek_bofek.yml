name: Temporary Tollebeek BOFEK spatial cross-check

on:
  push:
    branches:
      - work/tollebeek-profile-v0.1

permissions:
  contents: read

jobs:
  acquire-bofek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS acquisition dependencies
        run: python -m pip install requests py7zr geopandas pyogrio shapely
      - name: Download and intersect official BOFEK2020 GIS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          import py7zr
          import geopandas as gpd
          import pyogrio
          from shapely.geometry import shape

          out = Path('bofek_acquisition')
          out.mkdir(exist_ok=True)
          source_url = 'https://www.wur.nl/nl/show/bofek-2020-gis-1.htm'
          s = requests.Session()
          s.headers.update({'User-Agent':'Bodemverdichting-kosten-profile-qualification/0.1'})
          r = s.get(source_url, timeout=180, allow_redirects=True)
          r.raise_for_status()
          raw = r.content
          meta = {
              'requested_url': source_url,
              'final_url': r.url,
              'status_code': r.status_code,
              'content_type': r.headers.get('content-type'),
              'content_length': len(raw),
              'content_disposition': r.headers.get('content-disposition'),
              'magic_hex': raw[:16].hex(),
          }
          (out/'download_metadata.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          print(json.dumps(meta,indent=2))

          pkg = out/'BOFEK2020_GIS.7z'
          pkg.write_bytes(raw)
          if not raw.startswith(b"7z\xbc\xaf'\x1c"):
              raise SystemExit('BOFEK URL did not return a 7z archive')

          extract_dir = out/'extracted'
          with py7zr.SevenZipFile(pkg, mode='r') as z:
              z.extractall(path=extract_dir)

          gdbs = list(extract_dir.rglob('*.gdb'))
          if not gdbs:
              raise SystemExit('No file geodatabase found in BOFEK archive')
          gdb = gdbs[0]
          layers = pyogrio.list_layers(gdb)
          layer_meta=[]
          for name, geom_type in layers:
              layer_meta.append({'name': str(name), 'geometry_type': str(geom_type)})
          (out/'gdb_layers.json').write_text(json.dumps(layer_meta,indent=2),encoding='utf-8')
          print('layers', layer_meta)

          admitted = json.loads(Path('data/spatial/tollebeek_ot02_current.geojson').read_text(encoding='utf-8'))
          ot02 = shape(admitted['features'][0]['geometry'])
          ot02_gdf = gpd.GeoDataFrame({'spatial_unit_id':['TOLLEBEEK_OT02_CURRENT']}, geometry=[ot02], crs='EPSG:28992')

          summaries=[]
          for name, geom_type in layers:
              if 'Polygon' not in str(geom_type):
                  continue
              gdf = gpd.read_file(gdb, layer=str(name))
              if gdf.crs is None:
                  continue
              gdf = gdf.to_crs(28992)
              candidates = gdf[gdf.geometry.intersects(ot02)]
              if candidates.empty:
                  continue
              clipped = gpd.overlay(candidates, ot02_gdf, how='intersection', keep_geom_type=False)
              clipped = clipped[~clipped.geometry.is_empty].copy()
              clipped['intersection_area_m2'] = clipped.geometry.area
              clipped['intersection_area_ha'] = clipped['intersection_area_m2'] / 10000.0
              fields = [c for c in clipped.columns if c != clipped.geometry.name]
              records=[]
              for _, row in clipped.iterrows():
                  rec={}
                  for c in fields:
                      v=row[c]
                      if hasattr(v,'item'):
                          try: v=v.item()
                          except Exception: pass
                      if v is not None and str(v) != 'nan':
                          rec[c]=v
                  records.append(rec)
              summaries.append({
                  'layer': str(name),
                  'geometry_type': str(geom_type),
                  'source_crs': str(gdf.crs),
                  'source_columns': [str(c) for c in gdf.columns],
                  'intersection_feature_count': int(len(clipped)),
                  'intersection_area_ha_sum': float(clipped['intersection_area_ha'].sum()),
                  'records': records,
              })
              clipped.to_file(out/f'{name}_ot02_clip.geojson', driver='GeoJSON')

          result={'source':meta,'gdb':str(gdb),'layers':layer_meta,'intersection_summaries':summaries}
          (out/'bofek_ot02_intersection.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2,default=str)[:30000])
          PY
      - name: Upload BOFEK cross-check evidence
        uses: actions/upload-artifact@v4
        with:
          name: tollebeek-bofek-spatial-crosscheck
          path: bofek_acquisition/
          retention-days: 7
          if-no-files-found: error
