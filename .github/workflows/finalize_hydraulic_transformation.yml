name: Finalize hydraulic transformation architecture

on:
  push:
    branches:
      - work/tollebeek-hydraulic-transformation-v0.1

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml
      - name: Apply architecture patch
        run: python tools/_temp_finalize_hydraulic_transformation.py
      - name: Validate architecture
        run: |
          python tools/validate_project.py
          python -m unittest discover -s tests -v
      - name: Commit validated postimage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/03_conceptual_model.md \
            docs/04_formal_model.md \
            docs/05_data_model.md \
            docs/46_tollebeek_hydraulic_transformation_protocol_v0_1.md \
            schema/entities.yml \
            schema/datasets.yml \
            schema/relationships.yml \
            schema/controlled_vocabularies.yml \
            schema/hydraulic_parameterization_fields_v0_1.yml \
            evidence/sources.csv \
            evidence/evidence_register.csv \
            evidence/qualification_register.csv \
            evidence/claims.csv \
            model/equations.csv \
            model/traceability.csv \
            tools/validate_domain_schema.py \
            tools/validate_project.py \
            tests/test_hydraulic_parameterization_schema.py \
            workunits/tollebeek_hydraulic_transformation_v0_1_RECONCILE.md
          if git diff --cached --quiet; then
            echo "No permanent content changes to commit"
          else
            git commit -m "Add hydraulic transformation architecture"
            git push origin HEAD:work/tollebeek-hydraulic-transformation-v0.1
          fi
