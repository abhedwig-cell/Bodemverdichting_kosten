name: Finalize hydraulic transformation architecture

on:
  push:
    branches:
      - work/tollebeek-hydraulic-transformation-v0.1

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml
      - name: Apply hydraulic transformation architecture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv
          import io

          ROOT = Path('.')

          def replace_once(path, old, new):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected anchor not found in {path}')
              if text.count(old) != 1:
                  raise SystemExit(f'anchor not unique in {path}: {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def append_csv(path, key_field, rows):
              p = ROOT / path
              with p.open('r', encoding='utf-8', newline='') as f:
                  reader = csv.DictReader(f)
                  fieldnames = reader.fieldnames
                  current = list(reader)
              if not fieldnames:
                  raise SystemExit(f'no CSV header in {path}')
              existing = {r[key_field] for r in current}
              current.extend(r for r in rows if r[key_field] not in existing)
              with p.open('w', encoding='utf-8', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n')
                  writer.writeheader()
                  writer.writerows(current)

          # New field contract.
          hp_fields = '''schema_version: 0.4.0
status: PROVISIONAL_HYDRAULIC_TRANSFORMATION_EXTENSION

fields:
  hydraulic_parameterization_id:
    entity: hydraulic_parameterization
    label: Hydraulic parameterization ID
    description: Stable identifier for one state-specific hydraulic parameterization or qualified uncertainty member.
    datatype: string
    nullable: false

  hydraulic_method_class:
    entity: hydraulic_parameterization
    label: Hydraulic method class
    description: Authority class of the state-to-hydraulic transformation.
    datatype: enum
    vocabulary: hydraulic_method_class
    nullable: false

  hydraulic_method_id:
    entity: hydraulic_parameterization
    label: Hydraulic method ID
    description: Stable name or identifier of the measurement, fitting, pedotransfer or scenario method.
    datatype: string
    nullable: false

  hydraulic_method_version:
    entity: hydraulic_parameterization
    label: Hydraulic method version
    description: Immutable method/code/publication version used for the transformation.
    datatype: string
    nullable: true

  hydraulic_representation:
    entity: hydraulic_parameterization
    label: Hydraulic representation
    description: Representation serialized to the model, such as analytical Mualem-Van Genuchten parameters or a hydraulic table.
    datatype: enum
    vocabulary: hydraulic_representation
    nullable: false

  hydraulic_member_id:
    entity: hydraulic_parameterization
    label: Hydraulic uncertainty member ID
    description: Identifier for an uncertainty or scenario member when the transformation does not identify one unique hydraulic state.
    datatype: string
    nullable: true

  theta_r:
    entity: hydraulic_parameterization
    label: Residual water content
    description: Residual volumetric water content for an analytical hydraulic representation.
    datatype: float
    unit: cm3/cm3
    nullable: true

  theta_s:
    entity: hydraulic_parameterization
    label: Saturated water content
    description: Saturated volumetric water content for an analytical hydraulic representation; not automatically equal to porosity without qualification.
    datatype: float
    unit: cm3/cm3
    nullable: true

  alpha_cm_inv:
    entity: hydraulic_parameterization
    label: Van Genuchten alpha
    description: Alpha parameter of the selected analytical water-retention representation.
    datatype: float
    unit: 1/cm
    nullable: true

  n_vg:
    entity: hydraulic_parameterization
    label: Van Genuchten n
    description: Shape parameter n of the selected analytical water-retention representation.
    datatype: float
    unit: dimensionless
    nullable: true

  ksat_cm_d:
    entity: hydraulic_parameterization
    label: Saturated hydraulic conductivity
    description: Saturated or fitted saturated hydraulic conductivity used by the selected hydraulic representation; provenance must distinguish measured versus fitted/predicted values.
    datatype: float
    unit: cm/d
    nullable: true

  conductivity_exponent:
    entity: hydraulic_parameterization
    label: Hydraulic conductivity exponent
    description: Conductivity-function exponent used by the analytical representation when applicable.
    datatype: float
    unit: dimensionless
    nullable: true

  hydraulic_table_ref:
    entity: hydraulic_parameterization
    label: Hydraulic table reference
    description: Stable file/dataset/checksum reference when a tabulated water-retention and conductivity representation is used.
    datatype: string
    nullable: true

  hydraulic_uncertainty_ref:
    entity: hydraulic_parameterization
    label: Hydraulic uncertainty reference
    description: Reference to prediction interval, fit covariance, ensemble definition or other retained uncertainty description.
    datatype: string
    nullable: true

  swap_hydraulic_adapter_version:
    entity: hydraulic_parameterization
    label: SWAP hydraulic adapter version
    description: Version of the serialization adapter mapping canonical hydraulic semantics to the pinned SWAP input contract.
    datatype: string
    nullable: true
'''
          (ROOT/'schema/hydraulic_parameterization_fields_v0_1.yml').write_text(hp_fields, encoding='utf-8')

          # Entity.
          replace_once(
              'schema/entities.yml',
              '''  soil_state:\n    description: Physical state of a soil profile/layer for current, reference or explicit scenario conditions.\n    grain: one row per profile x layer x state\n''',
              '''  soil_state:\n    description: Physical state of a soil profile/layer for current, reference or explicit scenario conditions.\n    grain: one row per profile x layer x state\n\n  hydraulic_parameterization:\n    description: Versioned transformation of one soil state into model-ready soil hydraulic functions, retaining method, representation and uncertainty identity.\n    grain: one row per soil state x hydraulic method/version x uncertainty/member x representation\n'''
          )

          # Dataset.
          replace_once(
              'schema/datasets.yml',
              '''  soil_state_register:\n    entity: soil_state\n    role: MODEL_INPUT\n    grain: one row per soil profile x layer x state\n    primary_key: [soil_state_id]\n''',
              '''  soil_state_register:\n    entity: soil_state\n    role: MODEL_INPUT\n    grain: one row per soil profile x layer x state\n    primary_key: [soil_state_id]\n\n  hydraulic_parameterization_register:\n    entity: hydraulic_parameterization\n    role: MODEL_INPUT\n    grain: one row per soil state x hydraulic method/version x uncertainty/member x representation\n    primary_key: [hydraulic_parameterization_id]\n'''
          )

          # Relationships.
          replace_once(
              'schema/relationships.yml',
              '''  layer_state:\n    from_entity: soil_layer\n    to_entity: soil_state\n    cardinality: one-to-many\n    foreign_key: soil_state.soil_layer_id\n''',
              '''  layer_state:\n    from_entity: soil_layer\n    to_entity: soil_state\n    cardinality: one-to-many\n    foreign_key: soil_state.soil_layer_id\n\n  state_hydraulic_parameterization:\n    from_entity: soil_state\n    to_entity: hydraulic_parameterization\n    cardinality: one-to-many\n    foreign_key: hydraulic_parameterization.soil_state_id\n    implementation_note: Multiple qualified members may represent transformation uncertainty; they remain explicit rather than selecting a hidden best guess.\n'''
          )
          replace_once(
              'schema/relationships.yml',
              '''  soil_state_run:\n    from_entity: soil_state\n    to_entity: model_run\n    cardinality: one-to-many\n    foreign_key: model_run.soil_state_id\n    implementation_note: current/reference attribution requires the soil-state identity to be explicit rather than inferred from a run label\n''',
              '''  soil_state_run:\n    from_entity: soil_state\n    to_entity: model_run\n    cardinality: one-to-many\n    foreign_key: model_run.soil_state_id\n    implementation_note: current/reference attribution requires the soil-state identity to be explicit rather than inferred from a run label\n\n  hydraulic_parameterization_run:\n    from_entity: hydraulic_parameterization\n    to_entity: model_run\n    cardinality: one-to-many\n    foreign_key: model_run.hydraulic_parameterization_id\n    implementation_note: A run must expose the state-specific hydraulic parameterization separately from the shared model configuration.\n'''
          )

          # Controlled vocabularies.
          replace_once(
              'schema/controlled_vocabularies.yml',
              '''  soil_state_role:\n    - CURRENT\n    - REFERENCE\n    - SCENARIO\n''',
              '''  soil_state_role:\n    - CURRENT\n    - REFERENCE\n    - SCENARIO\n\n  hydraulic_method_class:\n    - H0_DIRECT_HYDRAULIC_EVIDENCE\n    - H1_QUALIFIED_PEDOTRANSFER\n    - H2_EVIDENCE_BOUNDED_SCENARIO\n\n  hydraulic_representation:\n    - MVG_ANALYTICAL\n    - HYDRAULIC_TABLE\n'''
          )

          # Conceptual model.
          replace_once(
              'docs/03_conceptual_model.md',
              '''Bulk density is conceptually a state variable when the project is comparing alternative physical conditions. Texture, by contrast, is normally part of the profile/layer context and should not change between a matched current/reference pair unless the scientific question explicitly requires it.\n\n#### `DrainageConfiguration`\n''',
              '''Bulk density is conceptually a state variable when the project is comparing alternative physical conditions. Texture, by contrast, is normally part of the profile/layer context and should not change between a matched current/reference pair unless the scientific question explicitly requires it.\n\n#### `HydraulicParameterization`\n\nA versioned transformation from one `SoilState` plus its retained profile/layer context to the soil hydraulic functions consumed by the source-response model. It records whether the functions are direct-measurement based, pedotransfer-derived or scenario/envelope based; the exact method/version; the hydraulic representation; and uncertainty/member identity.\n\nThis object is separate from `SoilState` because a measured bulk density or penetration resistance is not itself a complete water-retention/conductivity function. It is separate from `ModelConfiguration` because CURRENT and REFERENCE may legitimately have different state-specific hydraulic functions while sharing the same constitutive-model and numerical configuration.\n\n#### `DrainageConfiguration`\n'''
          )
          replace_once(
              'docs/03_conceptual_model.md',
              '''    SS --> MR\n    DC[DrainageConfiguration] --> MR\n''',
              '''    SS --> HP[HydraulicParameterization]\n    HP --> MR\n    DC[DrainageConfiguration] --> MR\n'''
          )

          # Formal model: insert new section before status.
          replace_once(
              'docs/04_formal_model.md',
              '## 4.17 Formal status\n',
              '''## 4.17 Soil-state to hydraulic-parameterization contract\n\nLet `S_i,s` be the admitted or explicitly scenario-qualified soil state for layer/profile unit `i` and state role `s`, and `X_i` the retained intrinsic/profile context used by a qualified transformation method `T_v`:\n\n```text\nH_i,s,m = T_v(S_i,s, X_i, m)\n```\n\nwhere `m` is an explicit uncertainty/scenario member when one unique hydraulic state is not identified, and `H` is the hydraulic representation consumed by SWAP (analytical parameters or a qualified hydraulic table).\n\nRules:\n\n- `T_v` has an immutable method/version and explicit predictor contract;\n- missing predictors remain missing and do not receive convenience defaults;\n- measured state variables are not relabelled as measured hydraulic parameters;\n- a fitted or pedotransfer-derived hydraulic function retains derived provenance and diagnostics/uncertainty;\n- Staring/BOFEK/SoilPhys modal values are context/method priors unless separately qualified for the intended state;\n- CURRENT and REFERENCE use the same transformation family/version and equivalent predictor semantics for simple matched attribution where scientifically possible;\n- asymmetric transformation methods become an explicit additional source of contrast and require separate qualification;\n- no single ensemble member may be selected because it yields a preferred hydrological response.\n\nFor an analytical Mualem–Van Genuchten representation, `H` may contain `theta_r`, `theta_s`, `alpha`, `n`, `Ksat` and the conductivity exponent plus configuration-dependent optional terms. For tabular input, `H` references the complete qualified retention/conductivity table.\n\nThis relation defines architecture and provenance. It does not supply numerical Tollebeek parameters.\n\n## 4.18 Formal status\n'''
          )
          replace_once(
              'docs/04_formal_model.md',
              '- construction of current/reference hydraulic parameter sets;\n',
              '- numerical qualification/admission of current/reference hydraulic parameter sets under the explicit hydraulic-transformation contract;\n'
          )

          # Data model description.
          replace_once(
              'docs/05_data_model.md',
              '- soil state;\n- drainage configuration;\n',
              '- soil state;\n- hydraulic parameterization;\n- drainage configuration;\n'
          )
          replace_once(
              'docs/05_data_model.md',
              '| `soil_state_register` | one row per profile × layer × state |\n',
              '| `soil_state_register` | one row per profile × layer × state |\n| `hydraulic_parameterization_register` | one row per soil state × method/version × uncertainty/member × representation |\n'
          )
          replace_once(
              'docs/05_data_model.md',
              '''Typical state variables include:\n\n- bulk density;\n- state-specific hydraulic properties where the project explicitly derives them from state;\n- compaction severity/state role.\n\nThis separation matters because the matched counterfactual normally changes soil state while preserving profile context.\n''',
              '''Typical state variables include:\n\n- bulk density;\n- compaction severity/state role;\n- other explicitly state-dependent measured indicators.\n\nState-specific hydraulic properties are represented through a separate `HydraulicParameterization` object when they are measured/fitted or derived from state. This preserves the distinction between measurement of physical state and transformation to model-ready retention/conductivity functions.\n\nThis separation matters because the matched counterfactual normally changes soil state while preserving profile context and transformation semantics.\n'''
          )

          # Domain field validator: extend rather than replace existing v0.3 contract.
          replace_once(
              'tools/validate_domain_schema.py',
              '    "event_forcing_fields_v0_1.yml",\n',
              '    "event_forcing_fields_v0_1.yml",\n    "hydraulic_parameterization_fields_v0_1.yml",\n'
          )
          replace_once(
              'tools/validate_domain_schema.py',
              '''REQUIRED_RUN_CONTROL_RELATIONSHIPS = {\n''',
              '''REQUIRED_HYDRAULIC_DATASETS = {\n    "hydraulic_parameterization_register": {\n        "entity": "hydraulic_parameterization",\n        "primary_key": ["hydraulic_parameterization_id"],\n    },\n}\n\nREQUIRED_RUN_CONTROL_RELATIONSHIPS = {\n'''
          )
          replace_once(
              'tools/validate_domain_schema.py',
              '''REQUIRED_PROFILE_RELATIONSHIPS = {\n''',
              '''REQUIRED_HYDRAULIC_RELATIONSHIPS = {\n    "state_hydraulic_parameterization": (\n        "soil_state", "hydraulic_parameterization", "soil_state_id"\n    ),\n    "hydraulic_parameterization_run": (\n        "hydraulic_parameterization", "model_run", "hydraulic_parameterization_id"\n    ),\n}\n\nREQUIRED_PROFILE_RELATIONSHIPS = {\n'''
          )
          replace_once(
              'tools/validate_domain_schema.py',
              '''    for dataset_id, expected in REQUIRED_V03_DATASETS.items():\n''',
              '''    for dataset_id, expected in {**REQUIRED_V03_DATASETS, **REQUIRED_HYDRAULIC_DATASETS}.items():\n'''
          )
          replace_once(
              'tools/validate_domain_schema.py',
              '''        **REQUIRED_PROFILE_RELATIONSHIPS,\n        **REQUIRED_RUN_CONTROL_RELATIONSHIPS,\n''',
              '''        **REQUIRED_PROFILE_RELATIONSHIPS,\n        **REQUIRED_HYDRAULIC_RELATIONSHIPS,\n        **REQUIRED_RUN_CONTROL_RELATIONSHIPS,\n'''
          )
          replace_once(
              'tools/validate_domain_schema.py',
              'print("Data Model v0.3 domain-schema validation passed.")',
              'print("Data Model v0.4 hydraulic-extension domain-schema validation passed.")'
          )
          replace_once(
              'tools/validate_domain_schema.py',
              '"Validated documented domain datasets, profile/run-control relationships, "\n        "field identity and the no-premature-attribution-pair boundary."',
              '"Validated documented domain datasets, profile/hydraulic/run-control relationships, "\n        "field identity and the no-premature-attribution-pair boundary."'
          )

          # Project structure requires protocol/schema extension.
          replace_once(
              'tools/validate_project.py',
              '    "docs/31_tollebeek_model_config_authority_route_v0_1.md",\n',
              '    "docs/31_tollebeek_model_config_authority_route_v0_1.md",\n    "docs/46_tollebeek_hydraulic_transformation_protocol_v0_1.md",\n'
          )
          replace_once(
              'tools/validate_project.py',
              '    "schema/event_forcing_fields_v0_1.yml",\n',
              '    "schema/event_forcing_fields_v0_1.yml",\n    "schema/hydraulic_parameterization_fields_v0_1.yml",\n'
          )
          replace_once(
              'tools/validate_project.py',
              '"Validated evidence integrity, formal traceability, Data Model v0.3 domain-schema "',
              '"Validated evidence integrity, formal traceability, Data Model v0.4 hydraulic-extension domain-schema "'
          )

          # Evidence sources.
          append_csv('evidence/sources.csv', 'source_id', [
              {
                  'source_id':'SRC_SWAP4_MANUAL','source_title':'SWAP version 4: theory description and user manual','source_type':'TECHNICAL_REPORT','source_year':'2017','source_url':'https://doi.org/10.18174/416321','source_status':'ADMITTED','source_notes':'Primary SWAP theory/input authority used here to define the hydraulic representation consumed by the model; it does not provide Tollebeek-specific hydraulic values.'
              },
              {
                  'source_id':'SRC_STARING2018','source_title':'Waterretentie- en doorlatendheidskarakteristieken van boven- en ondergronden in Nederland: Staringreeks update 2018','source_type':'TECHNICAL_REPORT','source_year':'2020','source_url':'https://doi.org/10.18174/512761','source_status':'QUALIFIED_WITH_LIMITATIONS','source_notes':'Dutch modal soil-hydraulic reference framework. Qualified as profile/method context; not automatically CURRENT or REFERENCE compaction-state hydraulics.'
              },
              {
                  'source_id':'SRC_VDBOLT2016_HYDRAULICS','source_title':'Bodemverdichting in Vlaanderen: Gevolgen van bodemverdichting op het watertransport door een bodem','source_type':'TECHNICAL_REPORT','source_year':'2016','source_url':'https://doi.org/10.18174/387766','source_status':'QUALIFIED_WITH_LIMITATIONS','source_notes':'WUR compaction/hydraulics study with measured properties, bulk-density-responsive pedotransfer functions and SWAP application; method precedent, not Tollebeek calibration.'
              },
              {
                  'source_id':'SRC_BOVER2024','source_title':'De invloed van bodemverdichting op de plantontwikkeling: BoVer eindrapport','source_type':'TECHNICAL_REPORT','source_year':'2024','source_url':'https://doi.org/10.18174/675719','source_status':'QUALIFIED_WITH_LIMITATIONS','source_notes':'WUR laboratory/column/field compaction experiments including treatment-specific hydraulic properties and SWAP simulations. Method evidence only for this project.'
              },
              {
                  'source_id':'SRC_VEREECKEN2010_PTF','source_title':'Using Pedotransfer Functions to Estimate the van Genuchten-Mualem Soil Hydraulic Properties: A Review','source_type':'PEER_REVIEWED_ARTICLE','source_year':'2010','source_url':'https://doi.org/10.2136/vzj2010.0045','source_status':'QUALIFIED_WITH_LIMITATIONS','source_notes':'Review of VGM pedotransfer functions, predictor sets, performance and need for structural/time-dependent information.'
              },
              {
                  'source_id':'SRC_MOSS2019_HYDRAULICS','source_title':'Effects of compaction on soil hydraulic properties, penetration resistance and water flow patterns at the soil profile scale','source_type':'PEER_REVIEWED_ARTICLE','source_year':'2019','source_url':'https://doi.org/10.1111/sum.12481','source_status':'QUALIFIED_WITH_LIMITATIONS','source_notes':'Field experiment demonstrating state-dependent bulk density, structural pore space, saturated conductivity and flow effects; supports the no-BD-only guardrail.'
              },
          ])

          append_csv('evidence/evidence_register.csv', 'evidence_id', [
              {
                  'evidence_id':'EV_SWAP_HYDRAULIC_INPUT_CONTRACT','source_id':'SRC_SWAP4_MANUAL','evidence_statement':'SWAP represents soil hydraulic behaviour per soil-physical layer using either analytical Mualem-Van Genuchten functions or hydraulic tables; analytical input includes residual/saturated water content, alpha, n, conductivity terms and saturated conductivity, while dry bulk density is also an explicit soil input.','spatial_scope':'SWAP model contract','time_scope':'2017 manual / pinned model-family semantics','evidence_value':'','evidence_unit':'','provenance_class':'TECHNICAL_REPORT_RELATION','intended_use':'Define the target semantics of canonical hydraulic parameterization before SWAP serialization','guardrail':'The SWAP input contract does not imply that bulk density uniquely determines the other hydraulic parameters.','evidence_status':'QUALIFIED'
              },
              {
                  'evidence_id':'EV_STARING_MODAL_HYDRAULICS','source_id':'SRC_STARING2018','evidence_statement':'The Staringreeks provides Dutch class-based mean water-retention and hydraulic-conductivity characteristics for topsoil/subsoil classes and translation functions from basic soil characteristics.','spatial_scope':'Netherlands modal soil-hydraulic context','time_scope':'Staringreeks update 2018 / publication 2020','evidence_value':'','evidence_unit':'','provenance_class':'TECHNICAL_REPORT_RELATION','intended_use':'Modal hydraulic benchmark and profile-context prior','guardrail':'Do not relabel a Staring/BOFEK modal characteristic as measured CURRENT anthropogenic compaction or as an observed uncompacted REFERENCE state.','evidence_status':'METHOD_PRIOR'
              },
              {
                  'evidence_id':'EV_VDBOLT_BD_RESPONSIVE_PTF','source_id':'SRC_VDBOLT2016_HYDRAULICS','evidence_statement':'In the WUR/Flanders compaction study, pedotransfer functions estimated retention and conductivity from soil properties; adding bulk density as predictor reduced prediction error especially in the wet range, predicted curves were fitted with Mualem-Van Genuchten functions and used in SWAP experiments.','spatial_scope':'Flanders compaction study','time_scope':'2016','evidence_value':'','evidence_unit':'','provenance_class':'TECHNICAL_REPORT_RELATION','intended_use':'Method precedent for a bulk-density-responsive H1 pedotransfer route','guardrail':'The fitted functions and coefficients are study-domain methods/results and are not directly transferable Tollebeek parameters without domain review.','evidence_status':'QUALIFIED'
              },
              {
                  'evidence_id':'EV_VEREECKEN_PTF_MULTI_PREDICTOR','source_id':'SRC_VEREECKEN2010_PTF','evidence_statement':'Review evidence shows that accurate VGM pedotransfer estimates generally use multiple soil predictors such as texture, bulk density and organic matter; hydraulic prediction remains model/domain dependent and structural properties are important for further improvement.','spatial_scope':'PTF literature synthesis','time_scope':'2010','evidence_value':'','evidence_unit':'','provenance_class':'PEER_REVIEWED_RELATION','intended_use':'Support explicit multi-predictor/versioned PTF and uncertainty contract','guardrail':'Bulk density alone is not sufficient evidence for a complete local hydraulic function.','evidence_status':'QUALIFIED'
              },
              {
                  'evidence_id':'EV_BOVER_DIRECT_HYDRAULIC_ROUTE','source_id':'SRC_BOVER2024','evidence_statement':'The BoVer experiments created multiple controlled compaction treatments with different dry bulk densities and used treatment-specific hydraulic properties in SWAP simulations.','spatial_scope':'Controlled laboratory/column experiments','time_scope':'2024 report','evidence_value':'','evidence_unit':'','provenance_class':'TECHNICAL_REPORT_RELATION','intended_use':'Support H0 direct-hydraulic-evidence route and treatment-specific state/hydraulic separation','guardrail':'Experimental treatment parameters are method evidence, not Tollebeek state values or universal compaction multipliers.','evidence_status':'QUALIFIED'
              },
              {
                  'evidence_id':'EV_MOSS_STRUCTURE_KSAT','source_id':'SRC_MOSS2019_HYDRAULICS','evidence_statement':'Field compaction experiments measured bulk density, penetration resistance, structural pore fractions and saturated hydraulic conductivity; compaction effects on water flow were associated with changes in structural pore space and conductivity.','spatial_scope':'Two field trial sites','time_scope':'2019 publication','evidence_value':'','evidence_unit':'','provenance_class':'PEER_REVIEWED_RELATION','intended_use':'Support structural-connectivity guardrail for state-to-hydraulic transformation','guardrail':'Equal or similar bulk density does not establish equal pore connectivity or hydraulic conductivity.','evidence_status':'QUALIFIED'
              },
          ])

          append_csv('evidence/qualification_register.csv', 'qualification_id', [
              {'qualification_id':'Q_SWAP_HYDRAULIC_INPUT_CONTRACT','evidence_id':'EV_SWAP_HYDRAULIC_INPUT_CONTRACT','intended_use':'Define SWAP hydraulic target representation','dependencies':'Pinned SWAP execution/model-family semantics','test_or_review':'Manual input-contract review','qualification_status':'QUALIFIED','review_date':'2026-09-16','qualification_notes':'Valid for defining target fields/representations; no local values implied.'},
              {'qualification_id':'Q_STARING_MODAL_HYDRAULICS','evidence_id':'EV_STARING_MODAL_HYDRAULICS','intended_use':'Dutch modal hydraulic benchmark/profile context','dependencies':'Profile/class identity and intended-use qualification','test_or_review':'Semantic review against CURRENT/REFERENCE state boundary','qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16','qualification_notes':'Method/context prior only for compaction-state transformation.'},
              {'qualification_id':'Q_VDBOLT_BD_RESPONSIVE_PTF','evidence_id':'EV_VDBOLT_BD_RESPONSIVE_PTF','intended_use':'Method precedent for H1 pedotransfer architecture','dependencies':'Comparable predictor definitions and explicit transferability/domain review before any Tollebeek use','test_or_review':'Review of report synthesis and SWAP/PTF method description','qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16','qualification_notes':'Supports route architecture, not coefficient transfer.'},
              {'qualification_id':'Q_VEREECKEN_PTF_MULTI_PREDICTOR','evidence_id':'EV_VEREECKEN_PTF_MULTI_PREDICTOR','intended_use':'PTF predictor/method uncertainty architecture','dependencies':'Exact PTF version and applicability domain required for numerical use','test_or_review':'Peer-reviewed review synthesis','qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16','qualification_notes':'Supports the no-bulk-density-only and explicit method/version rules.'},
              {'qualification_id':'Q_BOVER_DIRECT_HYDRAULIC_ROUTE','evidence_id':'EV_BOVER_DIRECT_HYDRAULIC_ROUTE','intended_use':'Direct measured/fitted hydraulic route precedent','dependencies':'Representative Tollebeek hydraulic measurements would still be required for H0 local use','test_or_review':'Technical-report method review','qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16','qualification_notes':'Experimental evidence establishes method logic, not local parameters.'},
              {'qualification_id':'Q_MOSS_STRUCTURE_KSAT','evidence_id':'EV_MOSS_STRUCTURE_KSAT','intended_use':'Guardrail against unique BD-to-hydraulics inference','dependencies':'None for qualitative method boundary; local quantitative transfer requires separate qualification','test_or_review':'Peer-reviewed field-study review','qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16','qualification_notes':'Supports explicit structure/connectivity uncertainty.'},
          ])

