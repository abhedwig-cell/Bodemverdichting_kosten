name: Temporary finalize profile admission metadata

on:
  push:
    branches:
      - work/tollebeek-profile-v0.1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tollebeek-profile-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile final profile admission metadata
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          def read_rows(path):
              with Path(path).open('r', encoding='utf-8', newline='') as f:
                  r = csv.DictReader(f)
                  return r.fieldnames, list(r)

          def write_rows(path, fields, rows):
              with Path(path).open('w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writeheader()
                  w.writerows(rows)

          p = 'evidence/qualification_register.csv'
          fields, rows = read_rows(p)
          for r in rows:
              if r['qualification_id'] == 'Q_SOILPHYS_ROUTE':
                  r['dependencies'] = 'WUR Soil Physical Data service; admitted OT.02 polygon; completed two-grid 500 m screening'
                  r['test_or_review'] = 'Route executed across 117 deterministic OT.02 points; 113 valid responses; eight profile IDs retained with explicit modal provenance'
                  r['qualification_status'] = 'QUALIFIED_WITH_LIMITATIONS'
                  r['review_date'] = '2026-09-16'
                  r['qualification_notes'] = 'Qualified for bounded profile-context acquisition. SoilPhys outputs remain derived/modal; no exact areal weights or CURRENT/REFERENCE compaction states are implied.'
          write_rows(p, fields, rows)

          p = 'data_requests/data_request_register.csv'
          fields, rows = read_rows(p)
          for r in rows:
              if r['data_request_id'] == 'DR_SM_GEOMETRY':
                  r['next_action'] = 'Geometry gate is closed for current peilgebied identity; re-open only if owner feature status or polygon changes.'
              if r['data_request_id'] == 'DR_SM_CURRENT_STATE':
                  r['current_evidence_ids'] = 'EV_SOILPHYS_ROUTE;EV_TOL_PROFILE_SCREENING;EV_TOL_PROFILE_BOFEK_CROSSWALK'
                  r['current_claim_ids'] = 'CL_SPATIAL_GATE;CL_TOL_PROFILE_BASIS;CL_THEORY_STATE_RESPONSE_CONTEXT'
                  r['next_action'] = 'Identify dated current-state measurements or a defensible separately qualified derivation for the admitted profile basis; if the first experiment uses a subset of profiles, justify that selection explicitly.'
                  r['request_notes'] = 'The profile basis is admitted, but API/modal density remains profile context and must not be promoted to current anthropogenic compaction.'
          write_rows(p, fields, rows)

          p = Path('tools/validate_project.py')
          text = p.read_text(encoding='utf-8')
          if 'docs/24_tollebeek_profile_baseline_v0_1.md' not in text:
              text = text.replace('    "docs/21_data_model_v0_3_contract.md",\n', '    "docs/21_data_model_v0_3_contract.md",\n    "docs/24_tollebeek_profile_baseline_v0_1.md",\n')
          text = text.replace(
              '"integrity, source-model input-readiness gates, admitted spatial geometry integrity "\n        "and required review structure."',
              '"integrity, source-model input-readiness gates, admitted spatial geometry and profile-baseline integrity "\n        "and required review structure."'
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit final metadata and remove this temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finalize_profile_admission.yml
          git add evidence/qualification_register.csv data_requests/data_request_register.csv tools/validate_project.py
          git commit -m "Finalize OT.02 profile admission metadata"
          git push origin HEAD:work/tollebeek-profile-v0.1
