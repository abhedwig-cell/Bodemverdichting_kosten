name: Retry finalize Tollebeek initial-state route

on:
  push:
    branches:
      - work/tollebeek-initial-state-v0.1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install pyyaml
      - name: Reuse bounded finalizer script
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/probe_tollebeek_initial_state.yml').read_text(encoding='utf-8')
          start=text.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end=text.index("\n          PY\n", start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          Path('/tmp/finalize_initial_state.py').write_text(code,encoding='utf-8')
          PY
          python /tmp/finalize_initial_state.py
      - name: Validate final postimage
        run: |
          python -m py_compile tools/validate_initial_state_gate.py tools/validate_project.py
          python tools/validate_project.py
          python -m unittest discover -s tests -v
      - name: Commit final postimage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence data_requests docs model tools tests workunits .github/workflows/ci.yml
          git commit -m "Qualify Tollebeek initial-state observation route"
          git push origin HEAD:work/tollebeek-initial-state-v0.1
