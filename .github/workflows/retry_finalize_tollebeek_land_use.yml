name: Retry Tollebeek land-use finalization

on:
  push:
    branches:
      - work/tollebeek-land-use-v0.1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install pyyaml
      - name: Reuse finalizer and preserve traceability contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/finalize_tollebeek_land_use.yml').read_text(encoding='utf-8')
          start=text.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end=text.index("\n          PY\n", start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          Path('/tmp/finalize_land_use.py').write_text(code,encoding='utf-8')
          PY
          python /tmp/finalize_land_use.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('model/traceability.csv')
          with p.open('r',encoding='utf-8',newline='') as f:
              r=csv.DictReader(f); fields=r.fieldnames or []; rows=list(r)
          found=False
          for row in rows:
              if row['capability_id']=='CAP_ATTRIB':
                  found=True
                  row['broken_link']='Current depth-resolved Tollebeek current/reference states are not admitted; event-relevant 1998 land-use/crop state is also not admitted; initial state and managed-boundary controls remain partial.'
          if not found: raise SystemExit('CAP_ATTRIB not found')
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
      - name: Validate postimage
        run: |
          python -m py_compile tools/validate_land_use_gate.py tools/validate_project.py
          python tools/validate_project.py
          python -m unittest discover -s tests -v
      - name: Commit postimage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence data_requests docs model tools tests workunits
          git commit -m "Qualify Tollebeek 1998 land-use evidence route"
          git push origin HEAD:work/tollebeek-land-use-v0.1
