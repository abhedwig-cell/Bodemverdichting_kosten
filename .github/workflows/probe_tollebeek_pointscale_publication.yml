name: Probe Tollebeek pointscale publication provenance

on:
  push:
    branches:
      - work/tollebeek-current-state-pointscale-route-v0.1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install --quiet beautifulsoup4 pypdf
      - name: Acquire and classify public article routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, re, urllib.request
          from pathlib import Path
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          ua = {'User-Agent':'Bodemverdichting-kosten-pointscale-recovery/0.2'}
          urls = {
              'mdpi_html':'https://www.mdpi.com/2073-4395/12/7/1669',
              'mdpi_xml':'https://www.mdpi.com/2073-4395/12/7/1669/xml',
              'wur_pdf':'https://edepot.wur.nl/577746',
          }
          acquired = {}
          texts = {}
          links = {}
          for key,url in urls.items():
              try:
                  req=urllib.request.Request(url, headers=ua)
                  with urllib.request.urlopen(req, timeout=90) as r:
                      data=r.read(); ctype=r.headers.get('Content-Type',''); final=r.geturl()
                  acquired[key]={'ok':True,'bytes':len(data),'content_type':ctype,'final_url':final}
                  if 'pdf' in ctype.lower() or data[:4] == b'%PDF':
                      reader=PdfReader(io.BytesIO(data))
                      text='\n'.join((p.extract_text() or '') for p in reader.pages)
                      texts[key]=text; links[key]=[]
                  else:
                      raw=data.decode('utf-8', errors='replace')
                      soup=BeautifulSoup(raw,'html.parser')
                      texts[key]=soup.get_text('\n')
                      found=[]
                      for a in soup.find_all('a', href=True):
                          href=a['href']; label=' '.join(a.stripped_strings)
                          if re.search(r'(supp|data|csv|xlsx|xls|zip|figshare|zenodo|repository|download)', href+' '+label, re.I):
                              found.append({'label':label[:200],'href':href})
                      links[key]=found[:100]
              except Exception as e:
                  acquired[key]={'ok':False,'error':repr(e)}; texts[key]=''; links[key]=[]

          needles = [
              'Data Availability Statement','Data Availability','Supplementary Materials','Supplementary',
              'Flevo-land','Flevoland in Beweging','Flevo–land','RAAK','RAAK.PRO02.021',
              'funding','funded','field site','study site','study area','sampling','measurement locations',
              'bulk density','penetration resistance','2018','2020','2021','coordinate','coordinates',
              'location','Emmeloord','available on request'
          ]
          contexts={}
          for key,text in texts.items():
              low=text.lower(); arr=[]
              for needle in needles:
                  start=0; count=0; nl=needle.lower()
                  while True:
                      i=low.find(nl,start)
                      if i<0: break
                      lo=max(0,i-400); hi=min(len(text),i+len(needle)+850)
                      snippet=re.sub(r'\s+',' ',text[lo:hi]).strip()
                      arr.append({'needle':needle,'snippet':snippet})
                      count += 1
                      if count>=6: break
                      start=i+len(nl)
              contexts[key]=arr

          alltext='\n'.join(texts.values()).lower()
          identifiers=['raak.pro02.021','flevo-land','flevoland in beweging','5200043298','672577']
          id_hits={x:(x in alltext) for x in identifiers}

          summary={
              'article_doi':'10.3390/agronomy12071669',
              'acquired':acquired,
              'identifier_hits':id_hits,
              'candidate_links':links,
              'contexts':contexts,
          }
          Path('pointscale_probe_summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          print('ACQUIRED',json.dumps(acquired,ensure_ascii=False,indent=2))
          print('IDENTIFIER_HITS',json.dumps(id_hits,ensure_ascii=False))
          wanted={'Data Availability Statement','Data Availability','Supplementary Materials','RAAK','RAAK.PRO02.021','field site','study site','study area','sampling','measurement locations','2018','coordinate','coordinates','location','Emmeloord','available on request'}
          for key in contexts:
              print('CONTEXT',key)
              for item in contexts[key]:
                  if item['needle'] in wanted:
                      print(json.dumps(item,ensure_ascii=False))
              print('LINKS',json.dumps(links[key],ensure_ascii=False,indent=2))
          PY
      - name: Upload provenance probe summary
        uses: actions/upload-artifact@v4
        with:
          name: tollebeek-pointscale-publication-probe
          path: pointscale_probe_summary.json
          if-no-files-found: error
