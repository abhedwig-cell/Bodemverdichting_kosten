name: Finalize Tollebeek event forcing baseline

on:
  push:
    branches:
      - work/tollebeek-event-forcing-v0.1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install finalization dependencies
        run: python -m pip install requests pyyaml
      - name: Build and register canonical event forcing
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, io, json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import requests
          import yaml

          ROOT = Path('.')
          BRANCH = 'work/tollebeek-event-forcing-v0.1'
          EVENT_ID = 'TOLLEBEEK_1998_EXTREME'
          SOURCE_ID = 'SRC_KNMI_MARKNESSE_273_HOURLY_1998'
          OWNER_SOURCE_ID = 'SRC_ZZL_TOLLEBEEK_WATEROVERLAST_1998'
          EXPECTED_RAW_SHA = '71f2b135769bfed476bbc9ee55282d7e5e9766e2eaf444aa1b8694d382d08dde'
          EXPECTED_FORCING_SHA = 'ef6d213c473179a59190c1a66215efe37c84664ed3b441749cdb24dd07381c4e'

          def read_csv(path: Path):
              with path.open('r', encoding='utf-8', newline='') as f:
                  return list(csv.DictReader(f)), csv.DictReader(path.open('r', encoding='utf-8', newline='')).fieldnames

          def upsert_csv(path: Path, key: str, row: dict[str, str]):
              with path.open('r', encoding='utf-8', newline='') as f:
                  reader = csv.DictReader(f)
                  fields = reader.fieldnames or []
                  rows = list(reader)
              if list(row.keys()) != fields:
                  missing = [x for x in fields if x not in row]
                  extra = [x for x in row if x not in fields]
                  if missing or extra:
                      raise SystemExit(f'{path}: row fields mismatch missing={missing} extra={extra}')
              replaced = False
              for i, current in enumerate(rows):
                  if current[key] == row[key]:
                      rows[i] = row
                      replaced = True
                      break
              if not replaced:
                  rows.append(row)
              with path.open('w', encoding='utf-8', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  writer.writeheader(); writer.writerows(rows)

          def append_semicolon(value: str, *items: str) -> str:
              parts = [x.strip() for x in value.split(';') if x.strip()]
              for item in items:
                  if item not in parts:
                      parts.append(item)
              return ';'.join(parts)

          # Reacquire exact KNMI source response and fail closed on source drift.
          url = 'https://www.daggegevens.knmi.nl/klimatologie/uurgegevens'
          form = {'start':'1998102401','end':'1998103124','vars':'ALL','stns':'273','fmt':'csv'}
          response = requests.post(url, data=form, timeout=120)
          response.raise_for_status()
          raw = response.content
          raw_sha = hashlib.sha256(raw).hexdigest()
          if raw_sha != EXPECTED_RAW_SHA:
              raise SystemExit(f'KNMI source bytes changed: {raw_sha} != {EXPECTED_RAW_SHA}; review required')

          names = ['STN','YYYYMMDD','HH','DD','FH','FF','FX','T','T10N','TD','SQ','Q','DR','RH','P','VV','N','U','WW','IX','M','R','S','O','Y']
          source_rows=[]
          for line in raw.decode('utf-8-sig').splitlines():
              if not line.strip() or line.startswith('#'):
                  continue
              parts=[p.strip() for p in line.split(',')]
              if len(parts) != len(names):
                  raise SystemExit(f'unexpected KNMI row width {len(parts)}')
              row=dict(zip(names,parts))
              d=datetime.strptime(row['YYYYMMDD'],'%Y%m%d').replace(tzinfo=timezone.utc)
              hh=int(row['HH'])
              row['interval_start_utc']=(d+timedelta(hours=hh-1)).isoformat().replace('+00:00','Z')
              row['interval_end_utc']=(d+timedelta(hours=hh)).isoformat().replace('+00:00','Z')
              if row['interval_start_utc'] >= '1998-10-24T00:00:00Z' and row['interval_end_utc'] <= '1998-10-30T00:00:00Z':
                  source_rows.append(row)
          if len(source_rows) != 144:
              raise SystemExit(f'expected 144 canonical hourly rows, got {len(source_rows)}')
          if source_rows[0]['interval_start_utc'] != '1998-10-24T00:00:00Z' or source_rows[-1]['interval_end_utc'] != '1998-10-30T00:00:00Z':
              raise SystemExit('canonical forcing window bounds changed')

          data_dir = ROOT / 'data' / 'events'
          data_dir.mkdir(parents=True, exist_ok=True)
          forcing_path = data_dir / 'tollebeek_1998_event_hourly_forcing.csv'
          forcing_fields=['forcing_observation_id','event_id','station_id','knmi_date','knmi_hour','interval_start_utc','interval_end_utc','wind_direction_deg','mean_wind_speed_tenth_m_s','air_temperature_tenth_c','dewpoint_temperature_tenth_c','global_radiation_j_cm2','precip_duration_tenth_hour','precip_tenth_mm','precip_trace_lt_0_05mm','relative_humidity_pct']
          with forcing_path.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=forcing_fields,lineterminator='\n'); w.writeheader()
              for i,r in enumerate(source_rows,1):
                  w.writerow({
                      'forcing_observation_id':f'TOL98_H{i:03d}','event_id':EVENT_ID,'station_id':r['STN'],
                      'knmi_date':r['YYYYMMDD'],'knmi_hour':r['HH'],'interval_start_utc':r['interval_start_utc'],'interval_end_utc':r['interval_end_utc'],
                      'wind_direction_deg':r['DD'],'mean_wind_speed_tenth_m_s':r['FH'],'air_temperature_tenth_c':r['T'],'dewpoint_temperature_tenth_c':r['TD'],
                      'global_radiation_j_cm2':r['Q'],'precip_duration_tenth_hour':r['DR'],'precip_tenth_mm':r['RH'],
                      'precip_trace_lt_0_05mm':'true' if r['RH']=='-1' else 'false','relative_humidity_pct':r['U'],
                  })
          forcing_sha=hashlib.sha256(forcing_path.read_bytes()).hexdigest()
          if forcing_sha != EXPECTED_FORCING_SHA:
              raise SystemExit(f'canonical forcing checksum changed: {forcing_sha}')

          def rh_mm(native: str) -> float:
              v=int(native)
              return 0.0 if v == -1 else v/10.0
          best=(-1.0,None,None)
          for i in range(len(source_rows)-23):
              total=sum(rh_mm(x['RH']) for x in source_rows[i:i+24])
              if total > best[0]:
                  best=(total,source_rows[i]['interval_start_utc'],source_rows[i+23]['interval_end_utc'])
          if round(best[0],1) != 88.4 or best[1:] != ('1998-10-27T06:00:00Z','1998-10-28T06:00:00Z'):
              raise SystemExit(f'unexpected event core: {best}')

          event_path=data_dir/'tollebeek_event_register.csv'
          event_fields=['event_id','event_label','event_kind','forcing_window_start_utc','forcing_window_end_utc','core_event_start_utc','core_event_end_utc','forcing_source_id','station_id','station_name','forcing_resolution','forcing_row_count','rolling_24h_max_precip_mm','notes']
          with event_path.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=event_fields,lineterminator='\n'); w.writeheader(); w.writerow({
                  'event_id':EVENT_ID,'event_label':'Tollebeek October 1998 extreme rainfall event','event_kind':'OBSERVED_EXTREME_RAINFALL',
                  'forcing_window_start_utc':'1998-10-24T00:00:00Z','forcing_window_end_utc':'1998-10-30T00:00:00Z',
                  'core_event_start_utc':'1998-10-27T06:00:00Z','core_event_end_utc':'1998-10-28T06:00:00Z',
                  'forcing_source_id':SOURCE_ID,'station_id':'273','station_name':'Marknesse','forcing_resolution':'1 hour','forcing_row_count':'144',
                  'rolling_24h_max_precip_mm':'88.4','notes':'Station-observed forcing baseline. Three antecedent days are included as forcing context only; they do not define hydrological initial state or warm-up. Point station forcing is not asserted to equal areal precipitation over OT.02.'
              })

          # Register domain entity, datasets and relationship with minimal textual edits.
          entities_path=ROOT/'schema/entities.yml'
          text=entities_path.read_text(encoding='utf-8')
          marker='  event:\n    description: Meteorological/hydrological event or simulation window.\n    grain: one row per event\n'
          addition=marker+'\n  forcing_observation:\n    description: Source-native meteorological forcing observation linked to one event and station/time interval.\n    grain: one row per event x station x forcing interval\n'
          if '  forcing_observation:' not in text:
              if marker not in text: raise SystemExit('event entity marker not found')
              entities_path.write_text(text.replace(marker,addition),encoding='utf-8')

          datasets_path=ROOT/'schema/datasets.yml'
          text=datasets_path.read_text(encoding='utf-8')
          old='  event_register:\n    entity: event\n    role: MODEL_INPUT\n    grain: one row per event/simulation window\n    primary_key: [event_id]\n'
          new=old+'    storage: data/events/tollebeek_event_register.csv\n\n  forcing_observation_register:\n    entity: forcing_observation\n    role: MODEL_INPUT\n    grain: one row per event x station x hourly forcing interval\n    primary_key: [forcing_observation_id]\n    storage: data/events/tollebeek_1998_event_hourly_forcing.csv\n'
          if '  forcing_observation_register:' not in text:
              if old not in text: raise SystemExit('event dataset marker not found')
              datasets_path.write_text(text.replace(old,new),encoding='utf-8')

          relationships_path=ROOT/'schema/relationships.yml'
          text=relationships_path.read_text(encoding='utf-8')
          relation='\n  event_forcing_observation:\n    from_entity: event\n    to_entity: forcing_observation\n    cardinality: one-to-many\n    foreign_key: forcing_observation.event_id\n'
          if '  event_forcing_observation:' not in text:
              relationships_path.write_text(text.rstrip()+relation+'\n',encoding='utf-8')

          fields_path=ROOT/'schema/event_forcing_fields_v0_1.yml'
          fields_path.write_text('''schema_version: 0.1.0\nstatus: BOUNDED_EVENT_FORCING_BASELINE\n\nfields:\n  forcing_observation_id:\n    entity: forcing_observation\n    label: Forcing observation ID\n    description: Stable identifier for one source-native forcing interval.\n    datatype: string\n    nullable: false\n  forcing_source_id:\n    entity: event\n    label: Forcing source ID\n    description: Source authority from which the event forcing observations were acquired.\n    datatype: string\n    nullable: false\n  station_id:\n    entity: forcing_observation\n    label: Station ID\n    description: Source-native station identifier.\n    datatype: string\n    nullable: false\n  interval_start_utc:\n    entity: forcing_observation\n    label: Interval start UTC\n    description: Inclusive start of the hourly forcing interval in UTC.\n    datatype: datetime\n    nullable: false\n  interval_end_utc:\n    entity: forcing_observation\n    label: Interval end UTC\n    description: Exclusive end of the hourly forcing interval in UTC.\n    datatype: datetime\n    nullable: false\n  precip_tenth_mm:\n    entity: forcing_observation\n    label: KNMI hourly precipitation native value\n    description: Source-native KNMI RH value in 0.1 mm; -1 means less than 0.05 mm and is not a physical negative precipitation.\n    datatype: integer\n    unit: 0.1 mm\n    nullable: false\n  precip_trace_lt_0_05mm:\n    entity: forcing_observation\n    label: Trace precipitation flag\n    description: True exactly when KNMI RH is -1, meaning less than 0.05 mm.\n    datatype: boolean\n    nullable: false\n  air_temperature_tenth_c:\n    entity: forcing_observation\n    label: Air temperature native value\n    datatype: integer\n    unit: 0.1 degC\n    nullable: false\n  dewpoint_temperature_tenth_c:\n    entity: forcing_observation\n    label: Dewpoint native value\n    datatype: integer\n    unit: 0.1 degC\n    nullable: false\n  global_radiation_j_cm2:\n    entity: forcing_observation\n    label: Global radiation\n    datatype: integer\n    unit: J/cm2 per hour\n    nullable: false\n  mean_wind_speed_tenth_m_s:\n    entity: forcing_observation\n    label: Hourly mean wind speed native value\n    datatype: integer\n    unit: 0.1 m/s\n    nullable: false\n  relative_humidity_pct:\n    entity: forcing_observation\n    label: Relative humidity\n    datatype: integer\n    unit: percent\n    nullable: false\n''',encoding='utf-8')

          domain_validator=ROOT/'tools/validate_domain_schema.py'
          text=domain_validator.read_text(encoding='utf-8')
          if '"event_forcing_fields_v0_1.yml"' not in text:
              text=text.replace('    "profile_fields_v0_1.yml",\n]','    "profile_fields_v0_1.yml",\n    "event_forcing_fields_v0_1.yml",\n]')
              domain_validator.write_text(text,encoding='utf-8')

          # Evidence and qualification chain.
          upsert_csv(ROOT/'evidence/sources.csv','source_id',{
              'source_id':SOURCE_ID,'source_title':'KNMI hourly observations station 273 Marknesse - October 1998','source_type':'DATA_SERVICE','source_year':'1998',
              'source_url':'https://www.daggegevens.knmi.nl/klimatologie/uurgegevens','source_status':'QUALIFIED_WITH_LIMITATIONS',
              'source_notes':f'Validated KNMI hourly station observations reacquired 2026-09-16. Canonical source response SHA-256 {raw_sha}; canonical 144-hour forcing SHA-256 {forcing_sha}. Historical hourly station series may be quality-adjusted by KNMI; refresh requires explicit requalification.'
          })
          upsert_csv(ROOT/'evidence/sources.csv','source_id',{
              'source_id':OWNER_SOURCE_ID,'source_title':'Waterschap Zuiderzeeland - Samenwerken om kans op wateroverlast te voorkomen','source_type':'OWNER_PUBLIC','source_year':'2023',
              'source_url':'https://www.zuiderzeeland.nl/samenwerken-om-kans-op-wateroverlast-te-voorkomen','source_status':'QUALIFIED_WITH_LIMITATIONS',
              'source_notes':'Owner retrospective on the October 1998 Tollebeek water-overlast event; reports more than 70 mm within 24 hours at some locations and 87.5 mm at Marknesse. Used for event significance and independent precipitation corroboration, not as an areal forcing series.'
          })
          upsert_csv(ROOT/'evidence/evidence_register.csv','evidence_id',{
              'evidence_id':'EV_TOL_EVENT_1998_OWNER','source_id':OWNER_SOURCE_ID,
              'evidence_statement':'Waterschap Zuiderzeeland identifies the 27-28 October 1998 extreme rainfall as the event that caused major wateroverlast around Tollebeek and reports 87.5 mm precipitation within 24 hours at Marknesse.',
              'spatial_scope':'Tollebeek / Marknesse event context','time_scope':'27-28 October 1998','evidence_value':'87.5','evidence_unit':'mm/24h','provenance_class':'OFFICIAL_METADATA',
              'intended_use':'Event significance and independent precipitation-magnitude corroboration','guardrail':'Owner retrospective is not a source-native hourly series and 87.5 mm is not asserted to be uniform areal precipitation over OT.02.','evidence_status':'QUALIFIED'
          })
          upsert_csv(ROOT/'evidence/evidence_register.csv','evidence_id',{
              'evidence_id':'EV_TOL_EVENT_1998_KNMI_FORCING','source_id':SOURCE_ID,
              'evidence_statement':'KNMI station 273 Marknesse provides 144 consecutive hourly observations for the canonical forcing window 1998-10-24 00:00 UTC through 1998-10-30 00:00 UTC. The maximum rolling 24-hour precipitation sum is 88.4 mm from 1998-10-27 06:00 UTC through 1998-10-28 06:00 UTC.',
              'spatial_scope':'KNMI station 273 Marknesse; applied as bounded Tollebeek forcing proxy','time_scope':'24-30 October 1998','evidence_value':'88.4','evidence_unit':'mm/24h','provenance_class':'DIRECT_MEASUREMENT',
              'intended_use':'Observed hourly forcing baseline for the first bounded Tollebeek source-model event','guardrail':'Point-station forcing is not asserted to equal areal precipitation over OT.02. Native RH=-1 means trace precipitation below 0.05 mm and is preserved; any model-specific conversion requires explicit mapping.','evidence_status':'QUALIFIED'
          })
          upsert_csv(ROOT/'evidence/claims.csv','claim_id',{
              'claim_id':'CL_TOL_EVENT_1998_FORCING',
              'claim_statement':'For the first bounded Tollebeek paired source-model experiment, the admitted observed event-forcing baseline is KNMI station 273 Marknesse hourly forcing from 1998-10-24 00:00 UTC through 1998-10-30 00:00 UTC, with the objectively identified 88.4 mm rolling-24-hour core from 1998-10-27 06:00 UTC through 1998-10-28 06:00 UTC.',
              'claim_type':'EVENT_FORCING_BASELINE','evidence_ids':'EV_TOL_EVENT_1998_KNMI_FORCING;EV_TOL_EVENT_1998_OWNER;EV_GROEN_HOURLY_FORCING','spatial_scope':'Tollebeek OT.02 experiment context / Marknesse station proxy','qualification_status':'QUALIFIED_WITH_LIMITATIONS',
              'guardrail':'Admission is for source-native observed station forcing and event selection only. It does not establish areal rainfall, initial hydrological state, warm-up, managed boundary behaviour, land use, drainage configuration or a SWAP-specific meteorological conversion.'
          })
          upsert_csv(ROOT/'evidence/qualification_register.csv','qualification_id',{
              'qualification_id':'Q_TOL_EVENT_1998_KNMI_FORCING','evidence_id':'EV_TOL_EVENT_1998_KNMI_FORCING','intended_use':'Observed hourly forcing baseline for first bounded Tollebeek source-model event',
              'dependencies':'KNMI station 273 source response; owner event corroboration; EV_GROEN_HOURLY_FORCING method guidance',
              'test_or_review':f'Exact-source checksum {raw_sha}; 144 contiguous hourly records; canonical forcing checksum {forcing_sha}; recomputed 24-hour maximum 88.4 mm at 1998-10-27 06:00 to 1998-10-28 06:00 UTC; owner 87.5 mm/24h corroboration reviewed.',
              'qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16','qualification_notes':'Qualified as point-station observed forcing for this bounded event. Spatial representativeness beyond the station and model-specific unit/trace conversion remain explicit downstream decisions.'
          })
          upsert_csv(ROOT/'evidence/qualification_register.csv','qualification_id',{
              'qualification_id':'Q_TOL_EVENT_1998_OWNER','evidence_id':'EV_TOL_EVENT_1998_OWNER','intended_use':'Independent event significance and precipitation-magnitude corroboration',
              'dependencies':'Owner retrospective public source','test_or_review':'Semantic cross-check against KNMI station 273 hourly series; owner 87.5 mm/24h versus KNMI rolling maximum 88.4 mm/24h.',
              'qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16','qualification_notes':'Valid corroboration of event extremity; not used as the hourly forcing dataset or as spatially uniform OT.02 rainfall.'
          })

          # Readiness gate becomes admitted for the bounded station-forcing use.
          request_path=ROOT/'data_requests/data_request_register.csv'
          with request_path.open('r',encoding='utf-8',newline='') as f:
              reader=csv.DictReader(f); request_fields=reader.fieldnames or []; requests=list(reader)
          found=False
          for row in requests:
              if row['data_request_id']=='DR_SM_EVENT_FORCING':
                  found=True
                  row['input_readiness_status']='ADMITTED'
                  row['current_evidence_ids']=append_semicolon(row['current_evidence_ids'],'EV_TOL_EVENT_1998_OWNER','EV_TOL_EVENT_1998_KNMI_FORCING')
                  row['current_claim_ids']=append_semicolon(row['current_claim_ids'],'CL_TOL_EVENT_1998_FORCING')
                  row['blocking_reason']='Resolved for the first bounded observed event-forcing baseline: a canonical 144-hour KNMI station 273 Marknesse series is persisted with source/checksum provenance, UTC interval bounds and native trace-precipitation semantics. Spatial representativeness and model-specific forcing conversion remain explicit limitations, not missing source data.'
                  row['next_action']='Use the admitted event/window to resolve DR_SM_INITIAL_STATE, DR_SM_MANAGED_BOUNDARY and DR_SM_LAND_USE; separately define the source-model meteorological mapping when DR_SM_MODEL_CONFIG is selected.'
                  row['request_notes']='Event core is 1998-10-27 06:00 to 1998-10-28 06:00 UTC with 88.4 mm rolling-24-hour station precipitation. The full forcing window is 1998-10-24 00:00 to 1998-10-30 00:00 UTC. Antecedent forcing does not define initial hydrological state; point station forcing is not asserted as OT.02 areal rainfall; native RH=-1 remains trace <0.05 mm.'
          if not found: raise SystemExit('DR_SM_EVENT_FORCING not found')
          with request_path.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=request_fields,lineterminator='\n'); w.writeheader(); w.writerows(requests)

          trace_path=ROOT/'model/traceability.csv'
          with trace_path.open('r',encoding='utf-8',newline='') as f:
              reader=csv.DictReader(f); trace_fields=reader.fieldnames or []; trace_rows=list(reader)
          for row in trace_rows:
              if row['capability_id']=='CAP_ATTRIB':
                  row['dataset_ids']=append_semicolon(row['dataset_ids'],'forcing_observation_register')
                  row['evidence_or_claim_ids']=append_semicolon(row['evidence_or_claim_ids'],'EV_TOL_EVENT_1998_KNMI_FORCING','CL_TOL_EVENT_1998_FORCING')
          with trace_path.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=trace_fields,lineterminator='\n'); w.writeheader(); w.writerows(trace_rows)

          doc=ROOT/'docs/27_tollebeek_event_forcing_baseline_v0_1.md'
          doc.write_text(f'''# Tollebeek event forcing baseline v0.1\n\nStatus: **ADMITTED FOR BOUNDED STATION-FORCING USE**\n\n## Decision\n\nThe first bounded Tollebeek event forcing is the October 1998 extreme rainfall episode. Canonical source forcing is the validated KNMI hourly series from station 273 Marknesse.\n\n- forcing window: `1998-10-24T00:00:00Z` to `1998-10-30T00:00:00Z`;\n- 144 consecutive one-hour records;\n- objective maximum rolling 24-hour precipitation: **88.4 mm**;\n- core interval: `1998-10-27T06:00:00Z` to `1998-10-28T06:00:00Z`;\n- canonical forcing SHA-256: `{forcing_sha}`;\n- source response SHA-256: `{raw_sha}`.\n\nWaterschap Zuiderzeeland independently reports 87.5 mm within 24 hours at Marknesse during the event and identifies the resulting wateroverlast around Tollebeek. This is corroboration, not a replacement for the hourly KNMI series.\n\n## Native semantics\n\nThe canonical forcing file preserves KNMI source units rather than silently converting them to a model-specific format. In particular, `precip_tenth_mm = -1` means trace precipitation below 0.05 mm. The trace flag is stored explicitly. A future model adapter must define how trace values and source units are converted.\n\n## Scientific boundary\n\nAdmission means that the project has a reproducible observed **station-forcing baseline** for this event. It does not mean:\n\n- the Marknesse point series equals areal precipitation over OT.02;\n- the three antecedent days define soil-water or groundwater initial state;\n- a warm-up procedure is admitted;\n- managed boundary behaviour is known;\n- land use/crop context is known;\n- drainage parameters are admitted;\n- SWAP input formatting or numerical configuration is selected.\n\nThose remain separate decision surfaces.\n''',encoding='utf-8')

          checkpoint=ROOT/'workunits/tollebeek_event_forcing_v0_1_ACQUIRE_CLASSIFY.md'
          checkpoint.write_text(f'''# Tollebeek event forcing v0.1 - ACQUIRE / CLASSIFY checkpoint\n\n- canonical start: `c5943df2a5e0dc340690ea748c72202955b83016`\n- branch: `{BRANCH}`\n- successful KNMI acquisition run: `35068470628`\n- failed parser-only probe run: `35068407343` (incorrect expected row width; no scientific mutation)\n- source response SHA-256: `{raw_sha}`\n- canonical forcing SHA-256: `{forcing_sha}`\n- rows: 144 contiguous hourly records\n- forcing window: 1998-10-24 00:00 UTC to 1998-10-30 00:00 UTC\n- core event: 1998-10-27 06:00 UTC to 1998-10-28 06:00 UTC\n- rolling 24-hour maximum: 88.4 mm\n- independent owner corroboration: 87.5 mm/24h at Marknesse\n- verdict: `ADMIT_BOUNDED_STATION_EVENT_FORCING`\n\nExclusions: no areal-rainfall claim, no initial-state inference, no warm-up, no boundary or drainage admission, no model-specific conversion, no source-model run.\n''',encoding='utf-8')

          # Event forcing validator and test.
          validator=ROOT/'tools/validate_event_forcing.py'
          validator.write_text('''from __future__ import annotations\n\nimport csv\nimport hashlib\nfrom datetime import datetime, timedelta\nfrom pathlib import Path\nimport yaml\n\nROOT = Path(__file__).resolve().parents[1]\nEVENT_FILE = ROOT / "data/events/tollebeek_event_register.csv"\nFORCING_FILE = ROOT / "data/events/tollebeek_1998_event_hourly_forcing.csv"\nREQUEST_FILE = ROOT / "data_requests/data_request_register.csv"\nDATASETS_FILE = ROOT / "schema/datasets.yml"\nENTITIES_FILE = ROOT / "schema/entities.yml"\nRELATIONSHIPS_FILE = ROOT / "schema/relationships.yml"\nEXPECTED_SHA = "ef6d213c473179a59190c1a66215efe37c84664ed3b441749cdb24dd07381c4e"\nEVENT_ID = "TOLLEBEEK_1998_EXTREME"\n\ndef read_csv(path: Path):\n    with path.open("r", encoding="utf-8", newline="") as f:\n        return list(csv.DictReader(f))\n\ndef validate() -> list[str]:\n    errors=[]\n    for p in (EVENT_FILE,FORCING_FILE):\n        if not p.exists(): errors.append(f"missing canonical event-forcing path: {p.relative_to(ROOT)}")\n    if errors: return errors\n    events=read_csv(EVENT_FILE)\n    if len(events)!=1 or events[0].get("event_id")!=EVENT_ID:\n        errors.append("event register must contain exactly TOLLEBEEK_1998_EXTREME")\n    else:\n        e=events[0]\n        expected={"forcing_window_start_utc":"1998-10-24T00:00:00Z","forcing_window_end_utc":"1998-10-30T00:00:00Z","core_event_start_utc":"1998-10-27T06:00:00Z","core_event_end_utc":"1998-10-28T06:00:00Z","station_id":"273","forcing_resolution":"1 hour","forcing_row_count":"144","rolling_24h_max_precip_mm":"88.4"}\n        for k,v in expected.items():\n            if e.get(k)!=v: errors.append(f"event {k}={e.get(k)!r} != {v!r}")\n    sha=hashlib.sha256(FORCING_FILE.read_bytes()).hexdigest()\n    if sha!=EXPECTED_SHA: errors.append(f"forcing checksum {sha} != {EXPECTED_SHA}")\n    rows=read_csv(FORCING_FILE)\n    if len(rows)!=144: errors.append(f"forcing row count {len(rows)} != 144")\n    if len({r.get("forcing_observation_id") for r in rows})!=len(rows): errors.append("forcing observation IDs are not unique")\n    required=("station_id","interval_start_utc","interval_end_utc","wind_direction_deg","mean_wind_speed_tenth_m_s","air_temperature_tenth_c","dewpoint_temperature_tenth_c","global_radiation_j_cm2","precip_duration_tenth_hour","precip_tenth_mm","relative_humidity_pct")\n    for i,r in enumerate(rows):\n        if r.get("event_id")!=EVENT_ID: errors.append(f"row {i+1} wrong event_id")\n        if r.get("station_id")!="273": errors.append(f"row {i+1} wrong station_id")\n        for field in required:\n            if r.get(field,"")=="": errors.append(f"row {i+1} missing {field}")\n        try:\n            p=int(r["precip_tenth_mm"])\n            if p < -1: errors.append(f"row {i+1} invalid precip native value {p}")\n            flag=r.get("precip_trace_lt_0_05mm")\n            if flag != ("true" if p==-1 else "false"): errors.append(f"row {i+1} trace flag inconsistent with precip")\n        except Exception:\n            errors.append(f"row {i+1} invalid precipitation encoding")\n        if i:\n            prev_end=datetime.fromisoformat(rows[i-1]["interval_end_utc"].replace("Z","+00:00"))\n            start=datetime.fromisoformat(r["interval_start_utc"].replace("Z","+00:00"))\n            if start!=prev_end: errors.append(f"forcing gap/overlap before row {i+1}")\n        start=datetime.fromisoformat(r["interval_start_utc"].replace("Z","+00:00"))\n        end=datetime.fromisoformat(r["interval_end_utc"].replace("Z","+00:00"))\n        if end-start != timedelta(hours=1): errors.append(f"row {i+1} is not one hour")\n    if rows:\n        if rows[0]["interval_start_utc"]!="1998-10-24T00:00:00Z" or rows[-1]["interval_end_utc"]!="1998-10-30T00:00:00Z": errors.append("forcing bounds mismatch")\n        vals=[0.0 if int(r["precip_tenth_mm"])==-1 else int(r["precip_tenth_mm"])/10.0 for r in rows]\n        best=max((sum(vals[i:i+24]),rows[i]["interval_start_utc"],rows[i+23]["interval_end_utc"]) for i in range(len(rows)-23))\n        if round(best[0],1)!=88.4 or best[1:]!=("1998-10-27T06:00:00Z","1998-10-28T06:00:00Z"): errors.append(f"rolling 24h event core mismatch: {best}")\n    requests={r["data_request_id"]:r for r in read_csv(REQUEST_FILE)}\n    req=requests.get("DR_SM_EVENT_FORCING")\n    if req is None: errors.append("missing DR_SM_EVENT_FORCING")\n    elif req.get("input_readiness_status")!="ADMITTED": errors.append("DR_SM_EVENT_FORCING must be ADMITTED when canonical forcing exists")\n    entities=yaml.safe_load(ENTITIES_FILE.read_text(encoding="utf-8"))["entities"]\n    datasets=yaml.safe_load(DATASETS_FILE.read_text(encoding="utf-8"))["datasets"]\n    rel=yaml.safe_load(RELATIONSHIPS_FILE.read_text(encoding="utf-8"))["relationships"]\n    if "forcing_observation" not in entities: errors.append("missing forcing_observation entity")\n    ds=datasets.get("forcing_observation_register",{})\n    if ds.get("entity")!="forcing_observation" or ds.get("storage")!="data/events/tollebeek_1998_event_hourly_forcing.csv": errors.append("forcing_observation_register contract mismatch")\n    if datasets.get("event_register",{}).get("storage")!="data/events/tollebeek_event_register.csv": errors.append("event_register storage mismatch")\n    rr=rel.get("event_forcing_observation",{})\n    if rr.get("foreign_key")!="forcing_observation.event_id": errors.append("event_forcing_observation relationship mismatch")\n    return errors\n\ndef main() -> int:\n    errors=validate()\n    if errors:\n        print("Tollebeek event-forcing validation FAILED")\n        for e in errors: print(f"ERROR: {e}")\n        return 1\n    print("Tollebeek event-forcing validation passed.")\n    print("Validated exact hourly source postimage, temporal continuity, native trace semantics, event core and admitted readiness boundary.")\n    return 0\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n''',encoding='utf-8')
          test=ROOT/'tests/test_event_forcing.py'
          test.write_text('''from __future__ import annotations\n\nimport sys\nimport unittest\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\nTOOLS=ROOT/"tools"\nif str(TOOLS) not in sys.path: sys.path.insert(0,str(TOOLS))\nfrom validate_event_forcing import validate\n\nclass EventForcingTests(unittest.TestCase):\n    def test_event_forcing_integrity(self):\n        self.assertEqual([],validate())\n\nif __name__ == "__main__":\n    unittest.main()\n''',encoding='utf-8')

          project_validator=ROOT/'tools/validate_project.py'
