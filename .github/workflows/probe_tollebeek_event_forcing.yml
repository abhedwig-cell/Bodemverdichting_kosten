              text=text.replace('from validate_evidence import validate as validate_evidence\n','from validate_evidence import validate as validate_evidence\nfrom validate_event_forcing import validate as validate_event_forcing\n')
          for required in ['    "docs/27_tollebeek_event_forcing_baseline_v0_1.md",\n','    "schema/event_forcing_fields_v0_1.yml",\n','    "data/events/tollebeek_event_register.csv",\n','    "data/events/tollebeek_1998_event_hourly_forcing.csv",\n']:
              if required.strip().strip(',').strip('"') not in text:
                  text=text.replace('    "docs/24_tollebeek_profile_baseline_v0_1.md",\n', '    "docs/24_tollebeek_profile_baseline_v0_1.md",\n'+required if 'docs/' in required else '    "docs/24_tollebeek_profile_baseline_v0_1.md",\n') if False else text
          # deterministic insertion by anchors
          if '"docs/27_tollebeek_event_forcing_baseline_v0_1.md"' not in text:
              text=text.replace('    "docs/26_tollebeek_drainage_evidence_route_v0_1.md",\n','    "docs/26_tollebeek_drainage_evidence_route_v0_1.md",\n    "docs/27_tollebeek_event_forcing_baseline_v0_1.md",\n')
          if '"schema/event_forcing_fields_v0_1.yml"' not in text:
              text=text.replace('    "schema/profile_fields_v0_1.yml",\n','    "schema/profile_fields_v0_1.yml",\n    "schema/event_forcing_fields_v0_1.yml",\n')
          if '"data/events/tollebeek_event_register.csv"' not in text:
              text=text.replace('    "data/spatial/tollebeek_ot02_current.geojson",\n','    "data/spatial/tollebeek_ot02_current.geojson",\n    "data/events/tollebeek_event_register.csv",\n    "data/events/tollebeek_1998_event_hourly_forcing.csv",\n')
          if 'errors.extend(f"event-forcing: {item}" for item in validate_event_forcing())' not in text:
              text=text.replace('    errors.extend(f"evidence: {item}" for item in validate_evidence())\n','    errors.extend(f"evidence: {item}" for item in validate_evidence())\n    errors.extend(f"event-forcing: {item}" for item in validate_event_forcing())\n')
          project_validator.write_text(text,encoding='utf-8')

          ci=ROOT/'.github/workflows/ci.yml'
          text=ci.read_text(encoding='utf-8')
          if 'tools/validate_event_forcing.py' not in text:
              text=text.replace('          tools/validate_evidence.py\n','          tools/validate_evidence.py\n          tools/validate_event_forcing.py\n')
          ci.write_text(text,encoding='utf-8')

          # Finalizer must not remain in canonical diff.
          Path('.github/workflows/probe_tollebeek_event_forcing.yml').unlink()
