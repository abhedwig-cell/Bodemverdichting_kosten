name: Probe Tollebeek BIS current-state provenance

on:
  push:
    branches:
      - work/tollebeek-current-state-bis-recovery-v0.1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spatial probe dependency
        run: python -m pip install --quiet shapely
      - name: Acquire 4TU BIS bulk-density source and inspect provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, io, json, re, urllib.request
          from collections import Counter
          from pathlib import Path
          from shapely.geometry import Point, shape

          article = 'c90215b3-bdc6-4633-b721-4c4a0259d6dc'
          meta_url = f'https://data.4tu.nl/v2/articles/{article}/files'
          ua = {'User-Agent':'Bodemverdichting-kosten-provenance-recovery/0.2'}
          with urllib.request.urlopen(urllib.request.Request(meta_url, headers=ua), timeout=60) as r:
              meta = json.loads(r.read())
          files = meta if isinstance(meta, list) else meta.get('files', meta.get('results', []))

          by_name = {f.get('name'): f for f in files}
          target = by_name.get('tbl_cal_BD_gcm3.csv')
          readme_meta = by_name.get('README.txt')
          if target is None:
              raise SystemExit('target file tbl_cal_BD_gcm3.csv not found')

          def acquire(f):
              fid = str(f.get('id') or f.get('uuid') or f.get('file_id') or '')
              if not fid:
                  raise SystemExit(f'file metadata has no usable id: {f}')
              dl = f.get('download_url') or f.get('downloadUrl') or f'https://data.4tu.nl/file/{article}/{fid}'
              with urllib.request.urlopen(urllib.request.Request(dl, headers=ua), timeout=120) as r:
                  data = r.read()
              return fid, dl, data

          fid, dl, data = acquire(target)
          Path('tbl_cal_BD_gcm3.csv').write_bytes(data)
          sha256 = hashlib.sha256(data).hexdigest()
          md5 = hashlib.md5(data).hexdigest()
          text = data.decode('utf-8-sig')
          reader = csv.DictReader(io.StringIO(text))
          rows = list(reader)
          fields = reader.fieldnames or []

          readme = ''
          readme_info = None
          if readme_meta:
              rid, rdl, rdata = acquire(readme_meta)
              readme = rdata.decode('utf-8-sig', errors='replace')
              readme_info = {
                  'file_id': rid,
                  'download_url': rdl,
                  'sha256': hashlib.sha256(rdata).hexdigest(),
                  'md5': hashlib.md5(rdata).hexdigest(),
                  'bytes': len(rdata),
              }

          tokens = [
              '5200043298', 'RAAK.PRO02.021', 'Flevo-land in beweging',
              'Flevo - land in beweging', '672577', 'WER 3382', '3382',
              'van egmond', 'teuling'
          ]
          token_hits = {t: [] for t in tokens}
          for i,row in enumerate(rows, start=2):
              joined = ' | '.join('' if v is None else str(v) for v in row.values())
              low = joined.lower()
              for t in tokens:
                  if t.lower() in low and len(token_hits[t]) < 25:
                      token_hits[t].append({'line':i, 'row':row})
          readme_token_hits = {t: (t.lower() in readme.lower()) for t in tokens}

          # Exact year screen.
          y2020_2021 = []
          for i,row in enumerate(rows, start=2):
              y = (row.get('year') or '').strip()
              if y in {'2020','2021','2020.0','2021.0'}:
                  y2020_2021.append({'line': i, 'row': row})

          # Spatial screen in native RD New (EPSG:28992), same as admitted OT.02 geometry.
          gj = json.loads(Path('data/spatial/tollebeek_ot02_current.geojson').read_text(encoding='utf-8'))
          if gj.get('type') == 'FeatureCollection':
              geoms = [shape(f['geometry']) for f in gj['features']]
              from shapely.ops import unary_union
              ot02 = unary_union(geoms)
          elif gj.get('type') == 'Feature':
              ot02 = shape(gj['geometry'])
          else:
              ot02 = shape(gj)

          inside = []
          for i,row in enumerate(rows, start=2):
              try:
                  x=float(row['X']); y=float(row['Y'])
              except (TypeError, ValueError, KeyError):
                  continue
              if ot02.covers(Point(x,y)):
                  inside.append({'line':i, 'row':row})

          inside_2020_2021 = [r for r in inside if (r['row'].get('year') or '').strip() in {'2020','2021','2020.0','2021.0'}]

          # Summaries by source coding to help trace provenance through README definitions.
          source_counts_all = Counter((r.get('BIS_tbl',''), r.get('BIS_type','')) for r in rows)
          source_counts_2020 = Counter((r['row'].get('BIS_tbl',''), r['row'].get('BIS_type','')) for r in y2020_2021)
          source_counts_inside = Counter((r['row'].get('BIS_tbl',''), r['row'].get('BIS_type','')) for r in inside)

          # Extract README lines mentioning source-code vocabulary and BD.
          readme_lines = readme.splitlines()
          readme_relevant = []
          needles = ['BIS_tbl','BIS_type','BPK','PFB','bulk','density','BD_gcm3','source','bron','project']
          for n,line in enumerate(readme_lines, start=1):
              if any(x.lower() in line.lower() for x in needles):
                  readme_relevant.append({'line':n, 'text':line})

          summary = {
              'article_uuid': article,
              'metadata_url': meta_url,
              'file_metadata': target,
              'resolved_file_id': fid,
              'download_url_used': dl,
              'bytes': len(data),
              'sha256': sha256,
              'md5': md5,
              'row_count': len(rows),
              'columns': fields,
              'token_hit_counts_csv': {k:len(v) for k,v in token_hits.items()},
              'token_hits_csv': token_hits,
              'token_hits_readme': readme_token_hits,
              'readme_info': readme_info,
              'readme_relevant_lines': readme_relevant,
              'year_2020_2021_count': len(y2020_2021),
              'year_2020_2021_rows': y2020_2021,
              'ot02_inside_count': len(inside),
              'ot02_inside_rows': inside,
              'ot02_inside_2020_2021_count': len(inside_2020_2021),
              'ot02_inside_2020_2021_rows': inside_2020_2021,
              'source_counts_all': {f'{a}|{b}':n for (a,b),n in source_counts_all.items()},
              'source_counts_2020_2021': {f'{a}|{b}':n for (a,b),n in source_counts_2020.items()},
              'source_counts_ot02_inside': {f'{a}|{b}':n for (a,b),n in source_counts_inside.items()},
          }
          Path('bis_probe_summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding='utf-8')

          print('BIS_FILE', json.dumps({
              'uuid':fid,'bytes':len(data),'sha256':sha256,'md5':md5,
              'row_count':len(rows),'columns':fields
          }, ensure_ascii=False))
          print('TOKEN_HITS_CSV', summary['token_hit_counts_csv'])
          print('TOKEN_HITS_README', summary['token_hits_readme'])
          print('SOURCE_COUNTS_2020_2021', summary['source_counts_2020_2021'])
          print('YEAR_2020_2021_ROWS')
          print(json.dumps(y2020_2021, indent=2, ensure_ascii=False))
          print('OT02_INSIDE_COUNT', len(inside))
          print('SOURCE_COUNTS_OT02_INSIDE', summary['source_counts_ot02_inside'])
          print('OT02_INSIDE_ROWS')
          print(json.dumps(inside, indent=2, ensure_ascii=False))
          print('OT02_INSIDE_2020_2021_COUNT', len(inside_2020_2021))
          print('README_RELEVANT_LINES')
          print(json.dumps(readme_relevant, indent=2, ensure_ascii=False))
          PY
      - name: Upload provenance probe summary
        uses: actions/upload-artifact@v4
        with:
          name: tollebeek-bis-current-state-probe
          path: bis_probe_summary.json
          if-no-files-found: error
