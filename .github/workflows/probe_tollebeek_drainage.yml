name: Temporary probe Tollebeek drainage authorities

on:
  push:
    branches:
      - work/tollebeek-drainage-v0.1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install requests shapely
      - name: Probe owner drainage services
        run: |
          python - <<'PY'
          import json, collections
          from pathlib import Path
          from datetime import datetime, timezone
          import requests
          from shapely.geometry import shape
          from shapely.ops import unary_union

          ROOT='https://services.arcgis.com/84oM5NriBghHdQ3Z/ArcGIS/rest/services'
          SERVICES={
              'zzl_Drainage': f'{ROOT}/zzl_Drainage/FeatureServer',
              'leggerkavelsloten': f'{ROOT}/leggerkavelsloten/FeatureServer',
              'Legger_NOP_2024': f'{ROOT}/Legger_watersysteem_2024_Noord_oostpolder__WFL1/FeatureServer',
          }
          ot=json.loads(Path('data/spatial/tollebeek_ot02_current.geojson').read_text(encoding='utf-8'))
          poly=shape(ot['features'][0]['geometry'])
          xmin,ymin,xmax,ymax=poly.bounds
          envelope=f'{xmin},{ymin},{xmax},{ymax}'
          s=requests.Session(); s.headers['User-Agent']='Bodemverdichting-kosten drainage qualification probe'

          def get_json(url, params=None):
              r=s.get(url,params=params,timeout=90); r.raise_for_status(); return r.json()
          def iso(ms):
              return datetime.fromtimestamp(ms/1000,timezone.utc).isoformat() if ms else None
          def query_layer(lurl):
              p={'where':'1=1','geometry':envelope,'geometryType':'esriGeometryEnvelope','inSR':'28992','spatialRel':'esriSpatialRelIntersects','outFields':'*','returnGeometry':'true','outSR':'28992','f':'geojson','resultRecordCount':'2000'}
              r=s.get(f'{lurl}/query',params=p,timeout=120); r.raise_for_status(); gj=r.json()
              if 'error' in gj: raise RuntimeError(gj['error'])
              inside=[]
              for f in gj.get('features',[]):
                  if f.get('geometry'):
                      g=shape(f['geometry'])
                      if g.intersects(poly): inside.append((f,g.intersection(poly)))
              return inside

          out={'ot02_area_ha':poly.area/10000,'services':{}}
          for key,url in SERVICES.items():
              sm=get_json(url,{'f':'json'})
              se={'itemId':sm.get('serviceItemId'),'serviceDescription':sm.get('serviceDescription'),'url':url,'layers':[]}
              for lyr in sm.get('layers',[]):
                  lurl=f"{url}/{lyr['id']}"; lm=get_json(lurl,{'f':'json'}); inside=query_layer(lurl)
                  geoms=[g for _,g in inside if not g.is_empty]
                  total_length=sum(g.length for g in geoms if g.geom_type in ('LineString','MultiLineString'))
                  union_area=unary_union([g for g in geoms if g.geom_type in ('Polygon','MultiPolygon')]).area if any(g.geom_type in ('Polygon','MultiPolygon') for g in geoms) else None
                  props=[f.get('properties',{}) for f,_ in inside]
                  summary={}
                  if key=='zzl_Drainage' and lyr['id']==0:
                      spacing=[p.get('IWS_AFSTAND_HART_OP_HART') for p in props]
                      depth=[p.get('IWS_DIEPTELIGGING') for p in props]
                      dates=[p.get('IWS_AANLEGDATUM') for p in props]
                      summary={
                        'nonzero_spacing_count':sum(v not in (None,0,0.0) for v in spacing),
                        'spacing_value_counts':dict(collections.Counter(str(v) for v in spacing)),
                        'nonnull_depth_count':sum(v is not None for v in depth),
                        'depth_value_counts':dict(collections.Counter(str(v) for v in depth)),
                        'nonnull_install_date_count':sum(v is not None for v in dates),
                        'install_date_value_counts':dict(collections.Counter(str(v) for v in dates)),
                        'union_intersection_area_ha':union_area/10000 if union_area is not None else None,
                        'ot02_area_coverage_fraction':union_area/poly.area if union_area is not None else None,
                        'ident_sample':[p.get('DRGIDENT') for p in props[:20]],
                      }
                  se['layers'].append({
                    'id':lyr['id'],'name':lm.get('name'),'geometryType':lm.get('geometryType'),
                    'dataLastEditDate':iso((lm.get('editingInfo') or {}).get('dataLastEditDate')),
                    'fields':[{'name':f.get('name'),'alias':f.get('alias')} for f in lm.get('fields',[])],
                    'ot02_intersection_count':len(inside),'total_clipped_length_m':total_length,
                    'summary':summary,
                    'samples':[p for p in props[:8]],
                  })
              out['services'][key]=se
          Path('drainage_probe.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(out,indent=2,ensure_ascii=False)[:60000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tollebeek-drainage-probe
          path: drainage_probe.json
