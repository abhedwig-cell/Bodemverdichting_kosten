name: Finalize Tollebeek model-config authority route

on:
  push:
    branches:
      - work/tollebeek-model-config-v0.1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install pyyaml
      - name: Persist model-config authority route
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv
          from pathlib import Path
          ROOT=Path('.')

          def upsert(path,key,row):
              with path.open('r',encoding='utf-8',newline='') as f:
                  r=csv.DictReader(f); fields=r.fieldnames or []; rows=list(r)
              if set(row)!=set(fields):
                  raise SystemExit(f'{path}: schema mismatch missing={set(fields)-set(row)} extra={set(row)-set(fields)}')
              for i,old in enumerate(rows):
                  if old[key]==row[key]: rows[i]=row; break
              else: rows.append(row)
              with path.open('w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          def add(value,*items):
              xs=[x.strip() for x in value.split(';') if x.strip()]
              for x in items:
                  if x not in xs: xs.append(x)
              return ';'.join(xs)

          upsert(ROOT/'evidence/sources.csv','source_id',{
              'source_id':'SRC_SWAP5_STATUS_A',
              'source_title':'SWAP5 Status-A current-canonical authority chain',
              'source_type':'SOFTWARE_REPOSITORY',
              'source_year':'2026',
              'source_url':'https://github.com/abhedwig-cell/SWAP5/blob/80c6faaa8a277d9596a6da7bc5d2244c0df1bb82/docs/status-a/CURRENT_STATUS.md',
              'source_status':'QUALIFIED_WITH_LIMITATIONS',
              'source_notes':'Immutable reviewed snapshot of SWAP5 current Status-A documentation. Distinguishes scientific production baseline 50346642..., Status-A acceptance authority 992a5c65..., and later canonical governance head 80c6faaa.... Used to qualify execution authority only, not to fill missing Tollebeek run inputs.'
          })

          evidence_rows=[
          {'evidence_id':'EV_SWAP5_SCIENTIFIC_PRODUCTION_BASELINE','source_id':'SRC_SWAP5_STATUS_A','evidence_statement':'SWAP5 current Status-A documentation pins scientific production baseline 50346642bd565f79134ea17d5462e544b354998c with scientific production tree 3b085d7dea3d3f3fce42ad9d8f259a8350205846.','spatial_scope':'SWAP5 scientific executable authority','time_scope':'Status-A documentation reviewed 2026-09-16','evidence_value':'50346642bd565f79134ea17d5462e544b354998c','evidence_unit':'git commit SHA','provenance_class':'SOFTWARE_AUTHORITY','intended_use':'Candidate pinned scientific executable authority for the first Tollebeek source-model pair','guardrail':'This pin does not choose Tollebeek drainage, initial state, dynamic managed boundary, crop/vegetation or CURRENT/REFERENCE soil-state values.','evidence_status':'QUALIFIED'},
          {'evidence_id':'EV_SWAP5_STATUS_A_ACCEPTANCE_AUTHORITY','source_id':'SRC_SWAP5_STATUS_A','evidence_statement':'SWAP5 current Status-A documentation identifies 992a5c657bfe10a10100f92e0cb77c4825ae65b6 as the current Status-A acceptance authority and explicitly states that it is later than the scientific production baseline without introducing a scientific production postimage change.','spatial_scope':'SWAP5 Status-A acceptance boundary','time_scope':'Status-A documentation reviewed 2026-09-16','evidence_value':'992a5c657bfe10a10100f92e0cb77c4825ae65b6','evidence_unit':'git commit SHA','provenance_class':'SOFTWARE_AUTHORITY','intended_use':'Acceptance/qualification authority surrounding the pinned SWAP5 scientific production baseline','guardrail':'Acceptance authority is not an executable substitute and does not authorize unadmitted project-specific inputs.','evidence_status':'QUALIFIED'},
          {'evidence_id':'EV_SWAP5_LIVE_GOVERNANCE_HEAD','source_id':'SRC_SWAP5_STATUS_A','evidence_statement':'Live SWAP5 canonical head reviewed for this workunit is 80c6faaa8a277d9596a6da7bc5d2244c0df1bb82. Its F-CI91 closeout is governance-only RossFast preservation and records no scientific replay, production readmission or Status-A denominator change.','spatial_scope':'SWAP5 current-canonical governance context','time_scope':'live-checked 2026-09-16','evidence_value':'80c6faaa8a277d9596a6da7bc5d2244c0df1bb82','evidence_unit':'git commit SHA','provenance_class':'SOFTWARE_AUTHORITY','intended_use':'Current governance/status context and proof that newest canonical head is not silently substituted for the pinned scientific production commit','guardrail':'Do not use a moving current-canonical governance head as the reproducible scientific executable pin merely because it is newer.','evidence_status':'QUALIFIED'}]
          for row in evidence_rows: upsert(ROOT/'evidence/evidence_register.csv','evidence_id',row)

          upsert(ROOT/'evidence/claims.csv','claim_id',{
              'claim_id':'CL_TOL_MODEL_CONFIG_GATE',
              'claim_statement':'The SWAP source-model family is project-intended and the SWAP5 authority chain is now qualified for configuration design: scientific executable authority 50346642bd565f79134ea17d5462e544b354998c, Status-A acceptance authority 992a5c657bfe10a10100f92e0cb77c4825ae65b6, with live canonical governance tracked separately. This is not yet a Tollebeek model configuration because several controlled scientific inputs remain unresolved. DR_SM_MODEL_CONFIG therefore remains data/configuration-gated until a concrete versioned configuration explicitly binds all required controlled dimensions without convenience defaults.',
              'claim_type':'MODEL_CONFIGURATION_DATA_GATE',
              'evidence_ids':'EV_SWAP5_SCIENTIFIC_PRODUCTION_BASELINE;EV_SWAP5_STATUS_A_ACCEPTANCE_AUTHORITY;EV_SWAP5_LIVE_GOVERNANCE_HEAD;EV_GROEN_BOUNDARY_SENSITIVITY',
              'spatial_scope':'First paired Tollebeek source-model experiment / EVT_TOL_1998_OCT',
              'qualification_status':'QUALIFIED',
              'guardrail':'Do not treat executable-authority pinning as admission of a runnable configuration. No missing drainage, initial-state, managed-boundary, crop/vegetation or CURRENT/REFERENCE soil-state value may be replaced by a SWAP default or convenience assumption.'
          })

          qual_rows=[
          {'qualification_id':'Q_SWAP5_SCIENTIFIC_PRODUCTION_BASELINE','evidence_id':'EV_SWAP5_SCIENTIFIC_PRODUCTION_BASELINE','intended_use':'Pin candidate scientific executable authority for first Tollebeek SWAP pair','dependencies':'SWAP5 canonical Status-A CURRENT_STATUS.md and unchanged scientific production tree','test_or_review':'Reviewed current canonical Status-A authority statement and distinguished production commit/tree from later governance heads.','qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16','qualification_notes':'Qualified as executable authority pin only; project-specific model configuration remains unadmitted.'},
          {'qualification_id':'Q_SWAP5_STATUS_A_ACCEPTANCE_AUTHORITY','evidence_id':'EV_SWAP5_STATUS_A_ACCEPTANCE_AUTHORITY','intended_use':'Pin SWAP5 acceptance authority around scientific executable baseline','dependencies':'SWAP5 Status-A current-status documentation','test_or_review':'Verified Status-A authority 992a5c65... and explicit no scientific production postimage change relative to 50346642....','qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16','qualification_notes':'Acceptance authority supports scope/qualification claims but is not the executable scientific commit.'},
          {'qualification_id':'Q_SWAP5_LIVE_GOVERNANCE_HEAD','evidence_id':'EV_SWAP5_LIVE_GOVERNANCE_HEAD','intended_use':'Track current-canonical status without using moving head as execution pin','dependencies':'SWAP5 integration/f-ci-canonical and F-CI91 closeout','test_or_review':'Live-checked 80c6faaa... and F-CI91 governance-only preservation statement.','qualification_status':'QUALIFIED_WITH_LIMITATIONS','review_date':'2026-09-16','qualification_notes':'Current governance context only; no new production authority inferred.'}]
          for row in qual_rows: upsert(ROOT/'evidence/qualification_register.csv','qualification_id',row)

          req=ROOT/'data_requests/data_request_register.csv'
          with req.open('r',encoding='utf-8',newline='') as f:
              r=csv.DictReader(f); fields=r.fieldnames or []; rows=list(r)
          found=False
          for row in rows:
              if row['data_request_id']=='DR_SM_MODEL_CONFIG':
                  found=True
                  row['input_readiness_status']='PARTIAL_EVIDENCE'
                  row['current_evidence_ids']=add(row['current_evidence_ids'],'EV_SWAP5_SCIENTIFIC_PRODUCTION_BASELINE','EV_SWAP5_STATUS_A_ACCEPTANCE_AUTHORITY','EV_SWAP5_LIVE_GOVERNANCE_HEAD')
                  row['current_claim_ids']=add(row['current_claim_ids'],'CL_TOL_MODEL_CONFIG_GATE')
                  row['blocking_reason']='SWAP5 execution/acceptance authority is now pinned, but no concrete Tollebeek model_configuration is admitted. CURRENT/REFERENCE soil state, drainage, initial state, dynamic managed boundary and event-relevant land-use/crop remain unresolved or partial; meteorological-to-model mapping and numerical/run-control choices are not yet persisted as one controlled configuration.'
                  row['next_action']='After the remaining scientific input decisions are admitted or separately qualified as explicit scenarios/reconstructions, create one versioned Tollebeek model_configuration that pins executable authority 50346642..., records Status-A acceptance 992a5c65..., maps admitted forcing variables/units, declares boundary/drainage/initial/crop semantics, numerical/time-step policy and output conventions, and proves CURRENT/REFERENCE configuration equality except for the admitted soil-state contrast.'
                  row['request_notes']='Detailed contract: data_requests/tollebeek_model_config_data_request_v0_1.md. Do not use SWAP defaults to close unresolved scientific inputs. Live canonical governance head is context, not a moving executable pin. No source-model run is permitted from this route-only qualification.'
          if not found: raise SystemExit('DR_SM_MODEL_CONFIG missing')
          with req.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          tp=ROOT/'model/traceability.csv'
          with tp.open('r',encoding='utf-8',newline='') as f:
              r=csv.DictReader(f); fields=r.fieldnames or []; rows=list(r)
          found=False
          for row in rows:
              if row['capability_id']=='CAP_ATTRIB':
                  found=True
                  if row['capability_status']!='DATA_GATED': raise SystemExit('CAP_ATTRIB unexpectedly not DATA_GATED')
                  row['evidence_or_claim_ids']=add(row['evidence_or_claim_ids'],'EV_SWAP5_SCIENTIFIC_PRODUCTION_BASELINE','EV_SWAP5_STATUS_A_ACCEPTANCE_AUTHORITY','CL_TOL_MODEL_CONFIG_GATE')
                  # Preserve exact previously qualified guardrail sentence.
                  row['broken_link']='Current depth-resolved Tollebeek current/reference states are not admitted; event-relevant 1998 land-use/crop state is also not admitted; initial state and managed-boundary controls remain partial. SWAP5 execution authority is pinned but a complete Tollebeek model configuration is not admitted.'
                  row['review_trigger']='Admission of current/reference soil state, 1998 land-use/crop state, initial/boundary/drainage configuration, or a concrete Tollebeek model_configuration.'
          if not found: raise SystemExit('CAP_ATTRIB missing')
          with tp.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          (ROOT/'data_requests/tollebeek_model_config_data_request_v0_1.md').write_text('''# Tollebeek model-configuration data/decision contract v0.1\n\nPurpose: resolve `DR_SM_MODEL_CONFIG` without using model defaults to hide open scientific inputs.\n\nQualified authority chain:\n- SWAP5 scientific executable authority: `50346642bd565f79134ea17d5462e544b354998c`;\n- scientific production tree: `3b085d7dea3d3f3fce42ad9d8f259a8350205846`;\n- Status-A acceptance authority: `992a5c657bfe10a10100f92e0cb77c4825ae65b6`;\n- current governance context reviewed: `80c6faaa8a277d9596a6da7bc5d2244c0df1bb82`.\n\nBefore configuration admission, persist one versioned configuration record with explicit executable/build authority, profile/unit mapping, CURRENT/REFERENCE state references, forcing conversion/mapping, event window, time-step/numerical policy, initialization/warm-up semantics, drainage representation, managed-boundary formulation, crop/vegetation treatment, output/sign/unit conventions and pair-equality rule.\n\nBlocked inputs remain blocked. Do not substitute default drainage resistance, groundwater level, free/closed lower boundary, representative crop, bare soil, or modal profile density. A scenario/reconstruction must be separately qualified and explicitly labelled.\n''',encoding='utf-8')

          (ROOT/'docs/31_tollebeek_model_config_authority_route_v0_1.md').write_text('''# Tollebeek model-configuration authority route v0.1\n\nStatus: **SWAP5 EXECUTION AUTHORITY QUALIFIED; TOLLEBEEK CONFIGURATION NOT ADMITTED**\n\n## Decision\n\n`DR_SM_MODEL_CONFIG` advances from `MISSING` to `PARTIAL_EVIDENCE`. The project now has an explicit, reproducible SWAP5 authority chain for designing the first paired source-model experiment, but not yet the full run configuration.\n\n## Authority roles\n\nThe executable scientific pin is SWAP5 `50346642bd565f79134ea17d5462e544b354998c` (production tree `3b085d7d...`). The Status-A acceptance authority is `992a5c657bfe10a10100f92e0cb77c4825ae65b6`. The later live canonical head `80c6faaa...` is governance/status context and is deliberately not used as a moving executable pin.\n\n## Why configuration remains open\n\nA model configuration is more than a software commit. It binds model structure, boundary, drainage, initial state, land-use/crop treatment, forcing conversion, numerical choices and controlled CURRENT/REFERENCE dimensions. Several of those project inputs remain partial. Creating a runnable configuration now would hide missing science behind defaults.\n\nNo model_configuration dataset/row and no CURRENT/REFERENCE model run is admitted by this workunit.\n''',encoding='utf-8')

          (ROOT/'workunits/tollebeek_model_config_v0_1_AUTHORITY_REVIEW.md').write_text('''# Tollebeek model configuration v0.1 — AUTHORITY REVIEW checkpoint\n\n- canonical project start: `f6aba17c016a4b860f750a17678cc4ec51875a3f`\n- SWAP5 scientific production authority: `50346642bd565f79134ea17d5462e544b354998c`\n- SWAP5 production tree: `3b085d7dea3d3f3fce42ad9d8f259a8350205846`\n- Status-A acceptance authority: `992a5c657bfe10a10100f92e0cb77c4825ae65b6`\n- live governance head reviewed: `80c6faaa8a277d9596a6da7bc5d2244c0df1bb82`\n\nVerdict: `QUALIFY_SWAP5_AUTHORITY_ROUTE_NO_ADMIT_TOLLEBEEK_CONFIGURATION`.\n\n`DR_SM_MODEL_CONFIG` may advance to `PARTIAL_EVIDENCE`; no configuration record or model run is admitted.\n''',encoding='utf-8')

          (ROOT/'tools/validate_model_config_gate.py').write_text('''from __future__ import annotations\nimport csv\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\nPROD='50346642bd565f79134ea17d5462e544b354998c'\nSTATUS='992a5c657bfe10a10100f92e0cb77c4825ae65b6'\nGOV='80c6faaa8a277d9596a6da7bc5d2244c0df1bb82'\n\ndef rows(path):\n    with path.open('r',encoding='utf-8',newline='') as f:return list(csv.DictReader(f))\n\ndef validate():\n    errors=[]\n    req={r['data_request_id']:r for r in rows(ROOT/'data_requests/data_request_register.csv')}.get('DR_SM_MODEL_CONFIG')\n    if not req:return ['missing DR_SM_MODEL_CONFIG']\n    if req.get('input_readiness_status')!='PARTIAL_EVIDENCE':errors.append('DR_SM_MODEL_CONFIG must remain PARTIAL_EVIDENCE; no concrete configuration is admitted')\n    for eid in ('EV_SWAP5_SCIENTIFIC_PRODUCTION_BASELINE','EV_SWAP5_STATUS_A_ACCEPTANCE_AUTHORITY','EV_SWAP5_LIVE_GOVERNANCE_HEAD'):\n        if eid not in req.get('current_evidence_ids',''):errors.append(f'DR_SM_MODEL_CONFIG missing {eid}')\n    if 'CL_TOL_MODEL_CONFIG_GATE' not in req.get('current_claim_ids',''):errors.append('model-config gate claim missing')\n    evidence={r['evidence_id']:r for r in rows(ROOT/'evidence/evidence_register.csv')}\n    if evidence.get('EV_SWAP5_SCIENTIFIC_PRODUCTION_BASELINE',{}).get('evidence_value')!=PROD:errors.append('SWAP5 production pin changed')\n    if evidence.get('EV_SWAP5_STATUS_A_ACCEPTANCE_AUTHORITY',{}).get('evidence_value')!=STATUS:errors.append('SWAP5 Status-A authority changed')\n    if evidence.get('EV_SWAP5_LIVE_GOVERNANCE_HEAD',{}).get('evidence_value')!=GOV:errors.append('reviewed live governance head changed')\n    claim={r['claim_id']:r for r in rows(ROOT/'evidence/claims.csv')}.get('CL_TOL_MODEL_CONFIG_GATE',{})\n    if claim.get('qualification_status')!='QUALIFIED':errors.append('model-config gate claim not QUALIFIED')\n    guard=(claim.get('guardrail','')+' '+req.get('blocking_reason','')+' '+req.get('request_notes','')).lower()\n    for phrase in ('drainage','initial','managed-boundary','crop','current/reference','default','no source-model run'):\n        if phrase not in guard:errors.append(f'model-config guardrail missing {phrase!r}')\n    trace={r['capability_id']:r for r in rows(ROOT/'model/traceability.csv')}.get('CAP_ATTRIB',{})\n    if trace.get('capability_status')!='DATA_GATED':errors.append('CAP_ATTRIB must remain DATA_GATED')\n    if 'Current depth-resolved Tollebeek current/reference states are not admitted' not in trace.get('broken_link',''):errors.append('canonical current/reference guardrail weakened')\n    forbidden=(ROOT/'data/model/tollebeek_model_configurations.csv',ROOT/'model/tollebeek_model_configurations.csv',ROOT/'data/configuration/tollebeek_model_configuration.csv')\n    for p in forbidden:\n        if p.exists():errors.append(f'unexpected admitted model configuration dataset: {p.relative_to(ROOT)}')\n    return errors\n\ndef main():\n    errors=validate()\n    if errors:\n        print('Tollebeek model-config gate validation FAILED')\n        for e in errors: print(f'ERROR: {e}')\n        return 1\n    print('Tollebeek model-config gate validation passed.')\n    print('Validated pinned SWAP5 authority chain and explicit no-admit configuration semantics.')\n    return 0\nif __name__=='__main__':raise SystemExit(main())\n''',encoding='utf-8')

          (ROOT/'tests/test_model_config_gate.py').write_text('''from __future__ import annotations\nimport sys,unittest\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1];TOOLS=ROOT/'tools'\nif str(TOOLS) not in sys.path:sys.path.insert(0,str(TOOLS))\nfrom validate_model_config_gate import validate\nclass ModelConfigGateTests(unittest.TestCase):\n    def test_model_config_gate_integrity(self):self.assertEqual([],validate())\nif __name__=='__main__':unittest.main()\n''',encoding='utf-8')

          pv=ROOT/'tools/validate_project.py'; text=pv.read_text(encoding='utf-8')
          if 'from validate_model_config_gate import validate as validate_model_config_gate' not in text:
              text=text.replace('from validate_land_use_gate import validate as validate_land_use_gate\n','from validate_land_use_gate import validate as validate_land_use_gate\nfrom validate_model_config_gate import validate as validate_model_config_gate\n')
          if '"docs/31_tollebeek_model_config_authority_route_v0_1.md"' not in text:
              text=text.replace('    "docs/30_tollebeek_land_use_evidence_route_v0_1.md",\n','    "docs/30_tollebeek_land_use_evidence_route_v0_1.md",\n    "docs/31_tollebeek_model_config_authority_route_v0_1.md",\n')
          if '"data_requests/tollebeek_model_config_data_request_v0_1.md"' not in text:
              text=text.replace('    "data_requests/tollebeek_land_use_data_request_v0_1.md",\n','    "data_requests/tollebeek_land_use_data_request_v0_1.md",\n    "data_requests/tollebeek_model_config_data_request_v0_1.md",\n')
          if 'errors.extend(f"model-config-gate: {item}" for item in validate_model_config_gate())' not in text:
              text=text.replace('    errors.extend(f"land-use-gate: {item}" for item in validate_land_use_gate())\n','    errors.extend(f"land-use-gate: {item}" for item in validate_land_use_gate())\n    errors.extend(f"model-config-gate: {item}" for item in validate_model_config_gate())\n')
          pv.write_text(text,encoding='utf-8')
          PY
      - name: Validate authority-route postimage
        run: |
          python -m py_compile tools/validate_model_config_gate.py tools/validate_project.py
          python tools/validate_project.py
          python -m unittest discover -s tests -v
      - name: Commit authority-route postimage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence data_requests docs model tools tests workunits
          git commit -m "Qualify Tollebeek SWAP5 model authority route"
          git push origin HEAD:work/tollebeek-model-config-v0.1
