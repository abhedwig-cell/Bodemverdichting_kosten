schema_version: 0.3.0
status: STATUS_A_LIGHT_DOMAIN_BASELINE

relationships:
  source_evidence:
    from_entity: source
    to_entity: evidence_item
    cardinality: one-to-many
    foreign_key: evidence_item.source_id

  evidence_claim:
    from_entity: evidence_item
    to_entity: claim
    cardinality: many-to-many
    implementation_note: use an explicit claim-evidence link table when multiple evidence items support one claim

  claim_qualification:
    from_entity: claim
    to_entity: qualification
    cardinality: one-to-many
    foreign_key: qualification.claim_id
    implementation_note: conceptual relation; current qualification storage may qualify evidence directly and must not invent a claim_id when none is registered

  spatial_profile:
    from_entity: spatial_unit
    to_entity: soil_profile
    cardinality: one-to-many
    foreign_key: soil_profile.spatial_unit_id

  profile_layer:
    from_entity: soil_profile
    to_entity: soil_layer
    cardinality: one-to-many
    foreign_key: soil_layer.soil_profile_id

  layer_state:
    from_entity: soil_layer
    to_entity: soil_state
    cardinality: one-to-many
    foreign_key: soil_state.soil_layer_id

  state_hydraulic_parameterization:
    from_entity: soil_state
    to_entity: hydraulic_parameterization
    cardinality: one-to-many
    foreign_key: hydraulic_parameterization.soil_state_id
    implementation_note: Multiple qualified members may represent transformation uncertainty; they remain explicit rather than selecting a hidden best guess.

  spatial_land_use:
    from_entity: spatial_unit
    to_entity: land_use_crop
    cardinality: one-to-many
    foreign_key: land_use_crop.spatial_unit_id

  spatial_run:
    from_entity: spatial_unit
    to_entity: model_run
    cardinality: one-to-many
    foreign_key: model_run.spatial_unit_id

  event_run:
    from_entity: event
    to_entity: model_run
    cardinality: one-to-many
    foreign_key: model_run.event_id

  event_forcing:
    from_entity: event
    to_entity: meteorological_forcing_observation
    cardinality: one-to-many
    foreign_key: meteorological_forcing_observation.event_id

  soil_state_run:
    from_entity: soil_state
    to_entity: model_run
    cardinality: one-to-many
    foreign_key: model_run.soil_state_id
    implementation_note: current/reference attribution requires the soil-state identity to be explicit rather than inferred from a run label

  hydraulic_parameterization_run:
    from_entity: hydraulic_parameterization
    to_entity: model_run
    cardinality: one-to-many
    foreign_key: model_run.hydraulic_parameterization_id
    implementation_note: A run must expose the state-specific hydraulic parameterization separately from the shared model configuration.

  model_configuration_run:
    from_entity: model_configuration
    to_entity: model_run
    cardinality: one-to-many
    foreign_key: model_run.model_configuration_id

  drainage_configuration_run:
    from_entity: drainage_configuration
    to_entity: model_run
    cardinality: one-to-many
    foreign_key: model_run.drainage_configuration_id

  land_use_crop_run:
    from_entity: land_use_crop
    to_entity: model_run
    cardinality: one-to-many
    foreign_key: model_run.land_use_crop_id
    implementation_note: required where crop or land use is a controlled run dimension; null remains null where the relation is not applicable or not yet registered

  run_response:
    from_entity: model_run
    to_entity: hydrological_response
    cardinality: one-to-many
    foreign_key: hydrological_response.model_run_id

  response_transfer:
    from_entity: hydrological_response
    to_entity: transfer_event
    cardinality: one-to-many
    implementation_note: transfer records must reference the qualified source-response record or comparison

  transfer_water_system:
    from_entity: transfer_event
    to_entity: water_system_unit
    cardinality: many-to-one
    foreign_key: transfer_event.water_system_unit_id

  dispatch_pump:
    from_entity: pump_dispatch
    to_entity: pump_asset
    cardinality: many-to-one
    foreign_key: pump_dispatch.pump_asset_id

  dispatch_event:
    from_entity: pump_dispatch
    to_entity: event
    cardinality: many-to-one
    foreign_key: pump_dispatch.event_id

  dispatch_source_zone:
    from_entity: pump_dispatch
    to_entity: spatial_unit
    cardinality: many-to-one
    foreign_key: pump_dispatch.source_zone_id
